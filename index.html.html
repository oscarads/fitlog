// AGENDA VIEW - puxa Google Agenda via Apps Script
// parseEvTitle("Rafael 8") -> {nome:"Rafael", numAula:8}
// Horarios livres: 6h-11h, seg-sex apenas
function parseEvTitle(title){
  const t=title.trim();
  // "Rafael 6/16" → numAula=6, totalAula=16
  const mFrac=t.match(/^(.+?)\s+(\d+)[\/\\](\d+)(\s+.*)?$/);
  if(mFrac)return{nome:mFrac[1].trim(),numAula:parseInt(mFrac[2]),totalAula:parseInt(mFrac[3])};
  // "Rafael 15" → numAula=15
  const m=t.match(/^(.+?)\s+(\d+)(\s+.*)?$/);
  if(m)return{nome:m[1].trim(),numAula:parseInt(m[2]),totalAula:null};
  return{nome:t,numAula:null,totalAula:null};
}

// ═══════════════════════════════════════════════════
// SEÇÃO 13: ABA AGENDA (📅)
// Integração com Google Calendar via API
// Modo "Hoje": mostra eventos do dia
// Modo "Semana": mostra semana com eventos por hora
// EventCard: cada evento de aluno tem botões ✓ e ✗
// Horários Livres: slots sem evento na janela 6h-11h
// parseEvTitle: lê "Rafael 5/8" → {numAula:5, totalAula:8}
// ═══════════════════════════════════════════════════
function AgendaView({students,onUpdate,gsUrl}){
  const now=new Date();
  const dateStr=d=>d.toISOString().slice(0,10);
  const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
  const getWeekStart=(off=0)=>{const d=new Date();d.setDate(d.getDate()-d.getDay()+1+(off*7));d.setHours(0,0,0,0);return d;};

  const [viewMode,setViewMode]=useState("hoje");
  const [weekOffset,setWeekOffset]=useState(0);
  const [events,setEvents]=useState([]);
  const [loading,setLoading]=useState(false);
  const [calError,setCalError]=useState("");
  const [cmd,setCmd]=useState("");
  const [cmdFeedback,setCmdFeedback]=useState("");
  const [showRelatorio,setShowRelatorio]=useState(false);

  // Ref para detectar double-tap por evento (1 toque = feita, 2 toques = falta)
  const lastClickMap=useRef({});

  // Marca aula como feita ou falta em uma data específica
  const marcarAula=(student,presente,ds)=>{
    const aula={id:uid(),data:ds,presente};
    onUpdate({...student,aulas:[...(student.aulas||[]).filter(a=>a.data!==ds),aula]});
  };

  // Ciclo de estados: pendente → feita → falta → remove
  // Sem timing, sem double-tap: 1 clique = check, 2º clique = falta, 3º = desfaz
  const handleEventTap=(ev,ds,s)=>{
    if(!s) return;
    const{totalAula}=parseEvTitle(ev.title);
    const aula=(s.aulas||[]).find(a=>a.data===ds);
    const status=!aula?"pendente":aula.presente?"feita":"falta";

    if(status==="pendente"){
      // 1º toque → feita: adiciona ao array, atualiza pacotePago se título tiver total
      const nova={id:uid(),data:ds,presente:true};
      onUpdate({...s,
        ...(totalAula?{pacotePago:totalAula}:{}),
        aulas:[...(s.aulas||[]).filter(a=>a.data!==ds),nova]
      });
    } else if(status==="feita"){
      // 2º toque → falta: falta conta no pacote
      const nova={id:uid(),data:ds,presente:false};
      onUpdate({...s,aulas:[...(s.aulas||[]).filter(a=>a.data!==ds),nova]});
    } else {
      // 3º toque → remove: sai do array
      onUpdate({...s,aulas:(s.aulas||[]).filter(a=>a.data!==ds)});
    }
  };

  const weekStart=getWeekStart(weekOffset);
  const weekDays=Array.from({length:7},(_,i)=>addDays(weekStart,i));
  const todayDs=dateStr(now);
  const mesAtual=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;

  const fetchEvents=useCallback(async()=>{
    setLoading(true);setCalError("");
    const start=viewMode==="hoje"?todayDs:dateStr(weekStart);
    const end=viewMode==="hoje"?todayDs:dateStr(addDays(weekStart,6));
    try{
      const r=await fetch(`${gsUrl}?action=calendar&start=${start}&end=${end}`);
      const j=await r.json();
      if(j.ok)setEvents(j.events||[]);
      else setCalError("Erro: "+j.error);
    }catch{
      setCalError("Não foi possível conectar.\n\nSolução: Apps Script → Executar → Autorizar acesso ao Google Agenda → volte e toque ↻");
    }
    setLoading(false);
  },[viewMode,weekOffset,gsUrl]);

  useEffect(()=>{fetchEvents();},[fetchEvents]);

  // Encontra aluno pelo primeiro nome — "Rafael 8" → busca "Rafael"
  const findStudent=title=>{
    const{nome}=parseEvTitle(title);
    const first=nome.split(" ")[0].toLowerCase();
    return students.find(s=>s.nome.toLowerCase().startsWith(first));
  };

  const eventsOfDay=ds=>[...events]
    .filter(ev=>ev.start.slice(0,10)===ds)
    .sort((a,b)=>a.start.localeCompare(b.start));

  // Marca/desmarca aula: pendente→feita, feita→falta, falta→remove
  const toggleAula=(student,ds,evTitle)=>{
    const aulas=student.aulas||[];
    const ex=aulas.find(a=>a.data===ds);
    const eraPresente=ex?.presente;
    const {numAula}=parseEvTitle(evTitle||"");

    // Se título tem número (ex: "Rafael 17"), reconstrói histórico retroativo
    const reconstruirHistorico=(n,dataMarcada)=>{
      if(!n||n<=0) return [dataMarcada];
      const dias=student.diasSemana||[];
      const vezesSemanais=student.vezesSemanais||0;
      const sessoes=[];
      let dt=new Date(dataMarcada+"T12:00");
      let encontradas=0;
      if(dias.length>0){
        // Usa dias configurados
        while(encontradas<n&&sessoes.length<500){
          if(dias.includes(dt.getDay())){
            sessoes.unshift(dt.toISOString().slice(0,10));
            encontradas++;
          }
          dt.setDate(dt.getDate()-1);
        }
      } else {
        // Sem dias fixos: pega qualquer dia útil (seg-sex), N vezes
        // Pula finais de semana pois personal trainer raramente atende dom/sab
        while(encontradas<n&&sessoes.length<500){
          const dow=dt.getDay();
          if(dow>=1&&dow<=6){ // Seg a Sáb
            sessoes.unshift(dt.toISOString().slice(0,10));
            encontradas++;
          }
          dt.setDate(dt.getDate()-1);
        }
      }
      return sessoes;
    };

    let novas=[...aulas];
    if(numAula&&numAula>0&&!eraPresente){
      // Reconstrói EXATAMENTE N sessões — SUBSTITUI registros no período
      const datas=reconstruirHistorico(numAula,ds);
      // Remove registros automáticos anteriores no mesmo período (evita duplicatas)
      const maisAntiga=datas[0];
      novas=novas.filter(a=>a.data>ds||a.data<maisAntiga||a._manual);
      // Adiciona as N sessões reconstruídas
      datas.forEach(d=>{
        if(!novas.find(a=>a.data===d))
          novas.push({id:uid(),data:d,presente:true});
      });
    } else if(!numAula){
      // Toggle normal (sem número no título)
      if(!ex)              novas=[...aulas,{id:uid(),data:ds,presente:true,_manual:true}];
      else if(ex.presente) novas=[...aulas.filter(a=>a.data!==ds),{...ex,presente:false}];
      else                 novas=aulas.filter(a=>a.data!==ds);
    }

    // Formato X/Y → X=feitas, Y=pacote pago
    // Ex: "Rafael 5/8" → fez 5, pagou 8
    const {numAula:_nAula,totalAula}=parseEvTitle(evTitle||"");
    let novoPacote=parseInt(student.pacotePago)||0;
    if(totalAula&&totalAula>0) novoPacote=totalAula;
    const updatedStudent={...student,aulas:novas,pacotePago:novoPacote};
    onUpdate(updatedStudent);
  };

  const marcarFalta=(student,ds)=>{
    const novas=[...(student.aulas||[]).filter(a=>a.data!==ds),{id:uid(),data:ds,presente:false}];
    onUpdate({...student,aulas:novas});
  };

  // Horários livres — 6h às 11h, segunda a sexta apenas
  const getHorariosLivres=(ds,inicio=6,fim=11)=>{
    const dow=new Date(ds+"T12:00").getDay();
    if(dow===0||dow===6) return [];
    // Filtra e ordena eventos dentro da janela
    const evs=eventsOfDay(ds)
      .filter(ev=>new Date(ev.start).getHours()<fim && (new Date(ev.end).getHours()||new Date(ev.start).getHours()+1)>inicio)
      .sort((a,b)=>a.start.localeCompare(b.start));
    const livres=[];
    let cur=inicio;
    evs.forEach(ev=>{
      const h=Math.max(new Date(ev.start).getHours(),inicio);
      const hEnd=Math.min(new Date(ev.end).getHours()||(new Date(ev.start).getHours()+1),fim);
      if(h>cur) livres.push({de:cur,ate:h});
      cur=Math.max(cur,hEnd);
    });
    if(cur<fim) livres.push({de:cur,ate:fim});
    return livres.filter(l=>l.ate-l.de>=1);
  };

  // Relatório semanal de horários livres
  const relatorio=()=>{
    const linhas=[];
    weekDays.forEach(d=>{
      const ds=dateStr(d);
      const livres=getHorariosLivres(ds);
      if(livres.length>0){
        const dia=d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"});
        const slots=livres.map(l=>`${String(l.de).padStart(2,"0")}:00–${String(l.ate).padStart(2,"0")}:00`).join(", ");
        linhas.push(`${dia}: ${slots}`);
      }
    });
    return linhas.length>0?linhas.join("\n"):"Nenhum horário livre esta semana.";
  };

  // ── CARD DE EVENTO ─────────────────────────────────────────────────────────
  const EventCard=({ev,ds})=>{
    const s=findStudent(ev.title);
    const{nome,numAula,totalAula:evTotal}=parseEvTitle(ev.title);
    const aula=s?(s.aulas||[]).find(a=>a.data===ds):null;
    const status=!aula?"pendente":aula.presente?"feita":"falta";
    const hora=new Date(ev.start).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    const horaFim=new Date(ev.end).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

    // ── CONTADOR: conta direto do s.aulas[] desde início do pacote
    // Assim clicar em datas antigas/novas em qualquer ordem sempre dá o total certo
    const since=s?getPackageStart(s):null;
    const dadaDisplay=s?(s.aulas||[]).filter(a=>a.data&&since&&a.data>=since).length:0;
    const totalDisplay=evTotal||parseInt(s?.pacotePago)||calcAulasPeriodo(since||"",new Date().toISOString().slice(0,10),s?.diasSemana||[])||8;
    const pct=Math.min((dadaDisplay/Math.max(totalDisplay,1))*100,100);

    const isAluno=!!s;
    const bgMap={feita:"rgba(0,200,100,0.09)",falta:"rgba(239,68,68,0.08)",pendente:isAluno?"#0a1628":"rgba(255,255,255,0.03)"};
    const borderMap={feita:"#00c86455",falta:"#ef444444",pendente:isAluno?"#1a3a5a":"#1a2030"};
    const accentColor=status==="feita"?"#00c864":status==="falta"?"#ef4444":"#4a9ebb";

    const statusIcon=status==="feita"?"✓":status==="falta"?"✗":"·";
    const statusBg=status==="feita"?"linear-gradient(135deg,#00c864,#00e5aa)":status==="falta"?"rgba(239,68,68,0.35)":"rgba(74,158,187,0.15)";
    const statusColor=status==="feita"?"#000":status==="falta"?"#ef4444":"#4a9ebb";
    // Dica do ciclo — mostra o próximo passo
    const nextLabel=status==="pendente"?"toque → ✓ check":status==="feita"?"toque → ✗ falta":"toque → desfazer";

    return <div style={{background:bgMap[status],border:`1px solid ${borderMap[status]}`,borderRadius:16,padding:"14px 16px",marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>

        {/* Botão único — ciclo: pendente → feita → falta → remove */}
        {isAluno?
          <button onClick={()=>handleEventTap(ev,ds,s)}
            style={{width:52,height:52,borderRadius:14,border:"none",cursor:"pointer",
              flexShrink:0,fontSize:22,fontWeight:900,
              background:statusBg,color:statusColor,
              display:"flex",alignItems:"center",justifyContent:"center",
              WebkitTapHighlightColor:"transparent"}}>
            {statusIcon}
          </button>:
          <div style={{width:52,height:52,borderRadius:14,flexShrink:0,background:"rgba(255,255,255,0.04)",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>
            📅
          </div>}

        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:2,flexWrap:"wrap"}}>
            <span style={{fontSize:17,fontWeight:800,color:isAluno?"#fff":"#aaa"}}>{nome}</span>
            <span style={{fontSize:11,color:"#4a7a9b"}}>{hora}{horaFim&&horaFim!==hora?" – "+horaFim:""}</span>
          </div>

          {isAluno&&<>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
              <span style={{fontSize:22,fontWeight:900,color:dadaDisplay>=totalDisplay?"#00c864":accentColor}}>{dadaDisplay}</span>
              <span style={{fontSize:13,color:"#4a7a9b"}}>/ {totalDisplay}</span>
              {status==="falta"&&<span style={{fontSize:10,background:"rgba(239,68,68,0.15)",color:"#ef4444",padding:"1px 7px",borderRadius:20}}>falta contada</span>}
              {dadaDisplay>=totalDisplay&&<span style={{fontSize:11,color:"#00c864",fontWeight:700}}>💰 cobrar!</span>}
            </div>
            <div style={{height:4,background:"#0e2035",borderRadius:2,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,borderRadius:2,transition:"width 0.4s",
                background:dadaDisplay>=totalDisplay?"linear-gradient(90deg,#00c864,#00e5aa)":"linear-gradient(90deg,#00b4d8,#00e5ff)"}}/>
            </div>
            <div style={{fontSize:9,color:"#2a4a5a",marginTop:3}}>{nextLabel}</div>
          </>}
          {!isAluno&&<div style={{fontSize:11,color:"#2a4a5a"}}>Não cadastrado</div>}
        </div>

        {/* Botão desfazer lateral — aparece se já marcado */}
        {isAluno&&aula&&
          <button onClick={()=>onUpdate({...s,aulas:(s.aulas||[]).filter(a=>a.data!==ds)})}
            title="Desfazer"
            style={{width:32,height:32,borderRadius:8,border:"1px solid #1a2a3a",
              background:"transparent",cursor:"pointer",flexShrink:0,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#2a5a7a"}}>↺</button>}
      </div>

      {dadaDisplay>=totalDisplay&&dadaDisplay>0&&
        <div style={{marginTop:10,padding:"8px 12px",background:"rgba(0,200,100,0.1)",borderRadius:10,fontSize:13,color:"#00c864",fontWeight:700}}>
          🎉 Pacote completo! Hora de cobrar.
        </div>}
    </div>;
  };

  // ── SLOT LIVRE ─────────────────────────────────────────────────────────────
  const SlotLivre=({de,ate})=>
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",marginBottom:8,
      borderRadius:12,border:"1px dashed #1a3a2a",background:"rgba(0,200,100,0.04)"}}>
      <span style={{fontSize:16}}>🟢</span>
      <span style={{fontSize:13,color:"#2a6a4a",fontWeight:600}}>
        Livre {String(de).padStart(2,"0")}:00 – {String(ate).padStart(2,"0")}:00
      </span>
      <span style={{fontSize:11,color:"#1a4a3a",marginLeft:"auto"}}>{ate-de}h disponível</span>
    </div>;

  // ── DIA COMPLETO (lista de eventos + slots livres intercalados) ─────────────
  const DayView=({ds,showFree=true})=>{
    const dow=new Date(ds+"T12:00").getDay();
    const isWeekend=dow===0||dow===6;
    const INICIO=6,FIM=11; // janela de trabalho
    const evs=eventsOfDay(ds);
    const livres=showFree&&!isWeekend?getHorariosLivres(ds):[];

    // intercala eventos dentro da janela + slots livres
    const allItems=[];
    const eventosDentro=evs.filter(ev=>{
      const h=new Date(ev.start).getHours();
      return h>=INICIO&&h<=FIM;
    });
    const eventosForaDaJanela=evs.filter(ev=>{
      const h=new Date(ev.start).getHours();
      return h<INICIO||h>FIM;
    });
    const eventosPorHora={};
    eventosDentro.forEach(ev=>{const h=new Date(ev.start).getHours();(eventosPorHora[h]=eventosPorHora[h]||[]).push(ev);});

    let curH=INICIO;
    Object.keys(eventosPorHora).sort((a,b)=>+a-+b).forEach(h=>{
      const hN=parseInt(h);
      if(showFree&&!isWeekend&&hN>curH&&hN<FIM) allItems.push({type:"livre",de:curH,ate:hN});
      eventosPorHora[h].forEach(ev=>allItems.push({type:"evento",ev}));
      const endH=Math.min(new Date(eventosPorHora[h].at(-1)?.end||"").getHours()||hN+1,FIM);
      curH=Math.max(curH,endH);
    });
    if(showFree&&!isWeekend&&curH<FIM) allItems.push({type:"livre",de:curH,ate:FIM});

    // eventos fora da janela (Oscar 11h, eventos da tarde etc) — lista separada
    const temEventosFora=eventosForaDaJanela.length>0;

    if(evs.length===0) return <div>
      {!isWeekend&&showFree&&<SlotLivre de={INICIO} ate={FIM}/>}
      {isWeekend&&<div style={{textAlign:"center",padding:"20px 0",color:"#2a5a7a",fontSize:13}}>Sem atendimento no fim de semana</div>}
    </div>;

    return <div>
      {allItems.map((item,i)=>item.type==="evento"?
        <EventCard key={item.ev.id} ev={item.ev} ds={ds}/>:
        <SlotLivre key={"l"+i} de={item.de} ate={item.ate}/>
      )}
      {temEventosFora&&<div style={{marginTop:8}}>
        <div style={{fontSize:10,color:"#2a3a4a",letterSpacing:1,marginBottom:6,paddingLeft:2}}>FORA DA JANELA DE ATENDIMENTO</div>
        {eventosForaDaJanela.map(ev=><EventCard key={ev.id} ev={ev} ds={ds}/>)}
      </div>}
    </div>;
  };

  // ── VISÃO HOJE ─────────────────────────────────────────────────────────────
  const HojeView=()=>{
    const evs=eventsOfDay(todayDs);
    const alunosEvs=evs.filter(ev=>findStudent(ev.title));
    const feitas=alunosEvs.filter(ev=>{const s=findStudent(ev.title);return s&&(s.aulas||[]).find(a=>a.data===todayDs&&a.presente);}).length;
    const total=alunosEvs.length;
    return <div>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:19,fontWeight:800}}>{new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:4}}>
          <span style={{fontSize:14,color:feitas===total&&total>0?"#00c864":"#aaa",fontWeight:600}}>
            {feitas}/{total} alunos marcados
          </span>
          {feitas===total&&total>0&&<span style={{fontSize:13,color:"#00c864",fontWeight:700}}>✓ Dia completo!</span>}
        </div>
        {total>0&&<div style={{height:6,background:"#0e2035",borderRadius:3,overflow:"hidden",marginTop:8}}>
          <div style={{height:"100%",width:`${total>0?(feitas/total)*100:0}%`,
            background:"linear-gradient(90deg,#00b4d8,#00e5ff)",borderRadius:3,transition:"width 0.4s"}}/>
        </div>}
      </div>
      <DayView ds={todayDs} showFree={true}/>

    </div>;
  };

  // ── VISÃO SEMANA ──────────────────────────────────────────────────────────
  const SemanaView=()=><div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <button onClick={()=>setWeekOffset(w=>w-1)}
        style={{background:"none",border:"1px solid #0e2035",borderRadius:8,color:"#4a7a9b",padding:"7px 14px",cursor:"pointer",fontSize:16}}>‹</button>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:12,fontWeight:700}}>{dateStr(weekStart).slice(5).replace("-","/")} — {dateStr(addDays(weekStart,6)).slice(5).replace("-","/")}</div>
        <div style={{fontSize:10,color:"#4a7a9b"}}>{weekOffset===0?"Esta semana":weekOffset===1?"Próxima":weekOffset===-1?"Semana passada":""}</div>
      </div>
      <button onClick={()=>setWeekOffset(w=>w+1)}
        style={{background:"none",border:"1px solid #0e2035",borderRadius:8,color:"#4a7a9b",padding:"7px 14px",cursor:"pointer",fontSize:16}}>›</button>
    </div>
    {weekDays.map(d=>{
      const ds=dateStr(d);
      const evs=eventsOfDay(ds);
      const isToday=ds===todayDs;
      const alunosEvs=evs.filter(ev=>findStudent(ev.title));
      const feitas=alunosEvs.filter(ev=>{const s=findStudent(ev.title);return s&&(s.aulas||[]).find(a=>a.data===ds&&a.presente);}).length;
      const dow=d.getDay();
      const livres=dow===0||dow===6?[]:getHorariosLivres(ds);
      return <div key={ds} style={{marginBottom:3,borderBottom:"1px solid #091520",paddingBottom:3}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0"}}>
          <div style={{width:36,height:36,borderRadius:9,flexShrink:0,
            background:isToday?"linear-gradient(135deg,#00b4d8,#00e5ff)":"#0a1628",
            border:`1px solid ${isToday?"transparent":"#0e2035"}`,
            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:9,color:isToday?"#000":"#4a7a9b",fontWeight:700}}>{DAYS[d.getDay()]}</span>
            <span style={{fontSize:14,fontWeight:900,color:isToday?"#000":"#fff",lineHeight:1}}>{d.getDate()}</span>
          </div>
          <div style={{flex:1,minWidth:0}}>
            {evs.length===0?
              <span style={{fontSize:11,color:"#1a3a4a"}}>Livre</span>:
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {evs.map(ev=>{
                  const s=findStudent(ev.title);
                  const aula=s&&(s.aulas||[]).find(a=>a.data===ds);
                  const status=!aula?"pendente":aula.presente?"feita":"falta";
                  const hora=new Date(ev.start).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
                  const cl={feita:"#00c864",falta:"#ef4444",pendente:s?"#4a9ebb":"#2a3a4a"};
                  const ic={feita:"✓",falta:"✗",pendente:s?"·":"📅"};
                  return <button key={ev.id}
                    onClick={()=>s&&handleEventTap(ev,ds,s)}
                    style={{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 9px",
                      borderRadius:10,border:`1px solid ${cl[status]}44`,background:`${cl[status]}15`,
                      cursor:s?"pointer":"default",minWidth:0}}>
                    <span style={{fontSize:12,fontWeight:700,color:cl[status]}}>{ic[status]}</span>
                    <span style={{fontSize:11,fontWeight:600,color:"#fff"}}>{parseEvTitle(ev.title).nome}</span>
                    <span style={{fontSize:9,color:"#4a7a9b"}}>{hora}</span>
                  </button>;
                })}
              </div>
            }
          </div>
          <div style={{textAlign:"right",flexShrink:0,minWidth:28}}>
            {alunosEvs.length>0&&<div style={{fontSize:12,fontWeight:800,color:feitas===alunosEvs.length?"#00c864":"#4a7a9b"}}>{feitas}/{alunosEvs.length}</div>}
            {livres.length>0&&<div style={{fontSize:9,color:"#1a5a3a"}}>🟢{livres.length}</div>}
          </div>
        </div>
        {isToday&&evs.length>0&&<div style={{marginLeft:44,marginTop:3}}>
          <DayView ds={ds} showFree={false}/>
        </div>}
      </div>;
    })}
  </div>;

  // ── RELATÓRIO DE HORÁRIOS LIVRES ───────────────────────────────────────────
  const RelatorioModal=()=>{
    const linhas=weekDays.map(d=>{
      const ds=dateStr(d);
      const evs=eventsOfDay(ds);
      const livres=getHorariosLivres(ds);
      const dia=d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"});
      return{dia,evs,livres};
    });
    const texto=linhas.map(l=>{
      if(l.livres.length===0) return `${l.dia}: Sem horários livres`;
      const slots=l.livres.map(lr=>`${String(lr.de).padStart(2,"0")}:00–${String(lr.ate).padStart(2,"0")}:00 (${lr.ate-lr.de}h)`).join(", ");
      return `${l.dia}:\n  Livres: ${slots}\n  Ocupados: ${l.evs.length} evento${l.evs.length!==1?"s":""}`;
    }).join("\n\n");
    const compartilhar=()=>{
      const slotsTexto=linhas.filter(l=>l.livres.length>0).map(l=>{
        const slots=l.livres.map(lr=>`${String(lr.de).padStart(2,"0")}:00–${String(lr.ate).padStart(2,"0")}:00`).join(", ");
        return `*${l.dia}:* ${slots}`;
      }).join("\n");
      const msg=`📅 *Horários disponíveis esta semana (6h–11h):*\n\n${slotsTexto||"Sem horários livres esta semana."}\n\nInteresse em treinar? Me chame! 💪`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,"_blank");
    };
    return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:50,display:"flex",alignItems:"flex-end"}}>
      <div style={{background:"#0a1628",borderRadius:"24px 24px 0 0",width:"100%",maxWidth:960,margin:"0 auto",padding:20,maxHeight:"85vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div>
            <div style={{fontSize:16,fontWeight:700}}>Horários Livres</div>
            <div style={{fontSize:12,color:"#4a7a9b"}}>Seg–Sex · 6h às 11h · {dateStr(weekStart).slice(5)} – {dateStr(addDays(weekStart,6)).slice(5)}</div>
          </div>
          <button onClick={()=>setShowRelatorio(false)} style={{background:"none",border:"none",color:"#4a7a9b",fontSize:24,cursor:"pointer"}}>×</button>
        </div>
        {linhas.map(({dia,evs,livres},i)=><div key={i} style={{marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:6}}>{dia}</div>
          {evs.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
            {evs.map(ev=><span key={ev.id} style={{fontSize:11,background:"rgba(239,68,68,0.1)",color:"#ef4444",padding:"2px 8px",borderRadius:20,border:"1px solid #ef444433"}}>
              🔴 {parseEvTitle(ev.title).nome} {new Date(ev.start).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
            </span>)}
          </div>}
          {livres.length>0?livres.map((l,j)=><div key={j} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:"rgba(0,200,100,0.07)",borderRadius:10,marginBottom:4,border:"1px solid #00c86422"}}>
            <span style={{fontSize:14}}>🟢</span>
            <span style={{fontSize:13,fontWeight:600,color:"#00c864"}}>{String(l.de).padStart(2,"0")}:00 – {String(l.ate).padStart(2,"0")}:00</span>
            <span style={{fontSize:11,color:"#2a7a4a",marginLeft:"auto"}}>{l.ate-l.de}h livre</span>
          </div>):
          <div style={{fontSize:12,color:"#2a5a7a",padding:"4px 10px"}}>Sem horários livres</div>}
        </div>)}
        <button onClick={compartilhar} style={{width:"100%",padding:"14px",borderRadius:14,border:"none",
          background:"linear-gradient(135deg,#25d366,#128c7e)",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",
          display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          📱 Compartilhar no WhatsApp
        </button>
      </div>
    </div>;
  };

  // ── COMANDO TEXTO ─────────────────────────────────────────────────────────
  const executarCmd=()=>{
    const c=cmd.toLowerCase().trim();let fb="";
    const mRange=c.match(/(desmarcar|cancelar|remover)\s+(\w+).*?(?:dia\s+)?(\d+)\s+(?:ao?\s+|a\s+|até\s+)(\d+)/i);
    if(mRange){
      const nome=mRange[2],d1=parseInt(mRange[3]),d2=parseInt(mRange[4]);
      const s=students.find(x=>x.nome.toLowerCase().startsWith(nome));
      if(!s){fb=`❌ "${nome}" não encontrado.`;}
      else{
        const mes=now.getMonth()+1,ano=now.getFullYear();
        const datas=[];for(let d=d1;d<=d2;d++)datas.push(`${ano}-${String(mes).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
        onUpdate({...s,aulas:(s.aulas||[]).filter(a=>!datas.includes(a.data))});
        fb=`✓ Aulas de ${s.nome} removidas do dia ${d1} ao ${d2}.`;
      }
    } else {
      const mFalta=c.match(/(falta|faltou)\s+(\w+).*?dia\s+(\d+)/i);
      if(mFalta){
        const s=students.find(x=>x.nome.toLowerCase().startsWith(mFalta[2]));
        if(!s){fb=`❌ "${mFalta[2]}" não encontrado.`;}
        else{
          const ds=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(parseInt(mFalta[3])).padStart(2,"0")}`;
          onUpdate({...s,aulas:[...(s.aulas||[]).filter(a=>a.data!==ds),{id:uid(),data:ds,presente:false}]});
          fb=`✓ Falta de ${s.nome} no dia ${mFalta[3]}.`;
        }
      } else fb="❓ Tente: 'desmarcar Rafael do dia 6 ao 17'";
    }
    setCmdFeedback(fb);setCmd("");setTimeout(()=>setCmdFeedback(""),4000);
  };

  return <div>
    {showRelatorio&&<RelatorioModal/>}

    {/* Tabs + botões */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{display:"flex",gap:0,background:"#0a1628",borderRadius:12,padding:3,border:"1px solid #0e2035"}}>
        {[["hoje","Hoje"],["semana","Semana"]].map(([v,l])=><button key={v} onClick={()=>setViewMode(v)}
          style={{padding:"9px 20px",borderRadius:9,border:"none",cursor:"pointer",fontSize:14,fontWeight:viewMode===v?700:400,
            background:viewMode===v?"linear-gradient(135deg,#00b4d8,#00e5ff)":"transparent",
            color:viewMode===v?"#000":"#4a7a9b"}}>{l}</button>)}
      </div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={()=>setShowRelatorio(true)}
          style={{padding:"9px 12px",borderRadius:10,border:"1px solid #00c86444",background:"rgba(0,200,100,0.07)",color:"#00c864",cursor:"pointer",fontSize:13,fontWeight:600}}>
          🟢 Livres
        </button>
        <button onClick={fetchEvents}
          style={{padding:"9px 12px",borderRadius:10,border:"1px solid #0e2035",background:"transparent",color:"#4a7a9b",cursor:"pointer",fontSize:16}}>↻</button>
      </div>
    </div>

    {loading&&<div style={{textAlign:"center",padding:28,color:"#4a7a9b",fontSize:15}}>⟳ Carregando agenda...</div>}

    {calError&&<div style={{background:"rgba(239,68,68,0.08)",border:"1px solid #ef444433",borderRadius:14,padding:16,marginBottom:14}}>
      <div style={{fontSize:14,color:"#ef4444",fontWeight:700,marginBottom:8}}>Erro ao carregar agenda</div>
      <div style={{fontSize:12,color:"#ef4444aa",lineHeight:1.7,whiteSpace:"pre-line",marginBottom:12}}>{calError}</div>
      <button onClick={fetchEvents} style={{width:"100%",padding:"11px",borderRadius:10,border:"none",background:"rgba(0,229,255,0.1)",color:"#00e5ff",fontSize:14,fontWeight:700,cursor:"pointer"}}>↻ Tentar novamente</button>
    </div>}

    {!loading&&!calError&&viewMode==="hoje"&&<HojeView/>}
    {!loading&&!calError&&viewMode==="semana"&&<SemanaView/>}

    {!loading&&!calError&&<div style={{marginTop:16,background:"#0a1628",border:"1px solid #0e2035",borderRadius:14,padding:14}}>
      <div style={{fontSize:10,color:"#4a7a9b",letterSpacing:1,marginBottom:5}}>COMANDO RÁPIDO</div>
      <div style={{fontSize:11,color:"#2a5a7a",marginBottom:8}}>"desmarcar Rafael do dia 6 ao 17" · "falta Rachel dia 12"</div>
      <div style={{display:"flex",gap:8}}>
        <input value={cmd} onChange={e=>setCmd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&executarCmd()}
          placeholder="Digite um comando..."
          style={{flex:1,background:"#060d18",border:"1px solid #0e2035",borderRadius:10,padding:"11px 12px",color:"#fff",fontSize:14,outline:"none"}}/>
        <button onClick={executarCmd}
          style={{padding:"11px 16px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#00b4d8,#00e5ff)",color:"#000",fontWeight:700,cursor:"pointer",fontSize:15}}>→</button>
      </div>
      {cmdFeedback&&<div style={{marginTop:8,fontSize:13,color:cmdFeedback.startsWith("✓")?"#00c864":"#f59e0b"}}>{cmdFeedback}</div>}
    </div>}
  </div>;
}


// ── APP ───────────────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════
// SEÇÃO 15: APP PRINCIPAL
// Estado global: plans, logs, students, sessions
// Sincronização: carrega do Google Sheets na inicialização
// Abas: Home(🏠) Agenda(📅) Alunos(👥) Treino(✏️)
// MeuDia(⚡) Clipboard(📋) Progresso(📈) Volume(📊)
// ═══════════════════════════════════════════════════
function App(){
  const [plans,setPlans]=useState(()=>ll("fl_plans",SEED_PLANS));
  const [sessions,setSessions]=useState(()=>ll("fl_sessions",[]));
  const [logs,setLogs]=useState(()=>ll("fl_logs",[]));
  const [students,setStudents]=useState(()=>ll("fl_students",[]));
  const [meuPix,setMeuPix]=useState(()=>ll("fl_pix",""));
  const [habitos,setHabitos]=useState(()=>ll("fl_habitos",[]));
  const [tarefas,setTarefas]=useState(()=>ll("fl_tarefas",[]));
  const [metas,setMetas]=useState(()=>ll("fl_metas",[]));
  const [tab,setTab]=useState("home");
  const [editPlan,setEditPlan]=useState(null);
  const [activeWorkout,setActiveWorkout]=useState(null);
  const [preTreino,setPreTreino]=useState(null);
  const [resumeData,setResumeData]=useState(()=>{
    const d=ll("fl_workout_inprogress",null);
    return d&&d.planId?d:null;
  });
  const [progressPlan,setProgressPlan]=useState(null);
  const [syncStatus,setSyncStatus]=useState("idle");

  useEffect(()=>{
    setSyncStatus("syncing");
    gsLoad().then(data=>{
      if(data){
        // Regra: só sobrescreve se Sheets trouxe dados reais
        // Se Sheets retornar vazio/undefined, mantém o cache local para não apagar dados
        const merge=(sheetsVal, localKey, fallback)=>{
          if(sheetsVal&&(Array.isArray(sheetsVal)?sheetsVal.length>0:true)) return sheetsVal;
          return ll(localKey, fallback);
        };
        const p=merge(data.plans,      "fl_plans",    SEED_PLANS);
        const s=merge(data.sessions,   "fl_sessions", []);
        const l=merge(data.logs,       "fl_logs",     []);
        const st=merge(data.students,  "fl_students", []);
        const h=merge(data.habitos,    "fl_habitos",  []);
        const t=merge(data.tarefas,    "fl_tarefas",  []);
        const m=merge(data.metas,      "fl_metas",    []);
        setPlans(p); setSessions(s); setLogs(l); setStudents(st);
        setHabitos(h); setTarefas(t); setMetas(m);
        if(data.pix!==undefined&&data.pix!==null){setMeuPix(data.pix);ls("fl_pix",data.pix);}
        // Atualiza cache local com o que veio do Sheets
        if(p?.length)ls("fl_plans",p);
        if(s?.length)ls("fl_sessions",s);
        if(l?.length)ls("fl_logs",l);
        if(st?.length)ls("fl_students",st);
        if(h?.length)ls("fl_habitos",h);
        if(t?.length)ls("fl_tarefas",t);
        if(m?.length)ls("fl_metas",m);
        syncPending({plans:p,sessions:s,logs:l,students:st,despesas:ll("fl_despesas",[]),habitos:h,tarefas:t,metas:m});
        setSyncStatus("ok");
      } else {
        setSyncStatus("err");
      }
      setTimeout(()=>setSyncStatus("idle"),3000);
    });
  },[]);

  const syncP=p=>{setPlans(p);gsSave("plans",p);};
  const syncS=s=>{setSessions(s);gsSave("sessions",s);};
  const syncL=l=>{setLogs(l);gsSave("logs",l);};
  const syncSt=s=>{setStudents(s);gsSave("students",s);};
  const savePix=v=>{setMeuPix(v);ls("fl_pix",v);gsSave("pix",v);};
  const syncHabitos=h=>{setHabitos(h);gsSave("habitos",h);};
  const syncTarefas=t=>{setTarefas(t);gsSave("tarefas",t);};
  const syncMetas=m=>{setMetas(m);gsSave("metas",m);};

  const savePlan=p=>{syncP(plans.findIndex(x=>x.id===p.id)>=0?plans.map(x=>x.id===p.id?p:x):[...plans,p]);setEditPlan(null);};
  const deletePlan=id=>{if(confirm("Apagar treino?"))syncP(plans.filter(x=>x.id!==id));};
  const finishWorkout=({entries,date,planId,planName,duration,workoutType,notes})=>{
    const sess={id:uid(),date,planId,planName,duration,workoutType,notes,entries};
    syncS([sess,...sessions]);
    syncL([...logs,...entries.map(e=>({id:uid(),date,exerciseId:e.exerciseId,name:e.name,
      // Salva séries de trabalho com flag isWarmup para reference
      sets:e.sets.filter(s=>s.reps||s.weight).map(s=>({...s}))
    }))]);
    setActiveWorkout(null);setTab("history");
  };
  const deleteSession=id=>{if(confirm("Apagar?"))syncS(sessions.filter(s=>s.id!==id));};
  const updateStudent=s=>syncSt(students.map(x=>x.id===s.id?s:x));
  const addStudent=s=>syncSt([...students,s]);
  const deleteStudent=id=>syncSt(students.filter(s=>s.id!==id));

  const todayIdx=new Date().getDay();
  // planos do dia de hoje — pode ser múltiplos (por trainingDays)
  const todayPlans=plans.filter(p=>(p.trainingDays||[p.dayIndex]).includes(todayIdx));
  const sortedPlans=[...plans].sort((a,b)=>((a.dayIndex-todayIdx+7)%7)-((b.dayIndex-todayIdx+7)%7));
  const streak=(()=>{let s=0,d=new Date();while(true){const ds=d.toISOString().slice(0,10);if(sessions.some(x=>x.date===ds)){s++;d.setDate(d.getDate()-1);}else break;}return s;})();
  const alertas=students.filter(s=>{const m=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,"0")}`;const d=(s.aulas||[]).filter(a=>a.data.startsWith(m)&&a.presente).length;return d>=(s.pacote||8);}).length;
  const lastSess=sessions.length>0?[...sessions].sort((a,b)=>b.date.localeCompare(a.date))[0]:null;
  const daysSince=lastSess?Math.round((new Date()-new Date(lastSess.date+"T12:00"))/86400000):null;

  if(preTreino){setActiveWorkout(preTreino);setPreTreino(null);}
  if(activeWorkout)return <ActiveWorkout plan={activeWorkout} logs={logs} onFinish={finishWorkout} onCancel={()=>setActiveWorkout(null)}/>;
  if(editPlan!==null)return <div style={{minHeight:"100vh",background:"#060d18",maxWidth:960,margin:"0 auto",padding:"20px 18px"}}><PlanEditor plan={editPlan==="new"?null:editPlan} onSave={savePlan} onCancel={()=>setEditPlan(null)}/></div>;
  if(progressPlan)return <div style={{minHeight:"100vh",background:"#060d18",maxWidth:960,margin:"0 auto"}}>
    <div style={{background:"#0a1628",padding:"16px 18px",borderBottom:"1px solid #0e2035",display:"flex",alignItems:"center",gap:12}}>
      <button onClick={()=>setProgressPlan(null)} style={{background:"none",border:"none",color:"#4a7a9b",fontSize:22,cursor:"pointer"}}>←</button>
      <div style={{fontSize:16,fontWeight:700}}>{progressPlan.name}</div>
    </div>
    <div style={{padding:"20px 18px"}}><ProgressView plan={progressPlan} logs={logs} sessions={sessions} plans={plans} students={students}/></div>
  </div>;

  return <div style={{minHeight:"100vh",background:"#060d18",maxWidth:960,margin:"0 auto",paddingBottom:80}}>
    <div style={{background:"#0a1628",padding:"16px 18px 0",borderBottom:"1px solid #0e2035",position:"sticky",top:0,zIndex:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div>
          <div style={{fontSize:22,fontWeight:900,letterSpacing:-1,background:"linear-gradient(90deg,#00b4d8,#00e5ff)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>FitLog Pro</div>
          <div style={{fontSize:11,color:"#2a6a8a",display:"flex",alignItems:"center",gap:6}}>
            {streak>0?`🔥 ${streak} dia${streak>1?"s":""} seguido${streak>1?"s":""}` :"Bora!"}
            {daysSince>=5&&<span style={{color:"#ef4444",fontSize:10}}>⚠ {daysSince}d sem treinar</span>}
            {syncStatus==="syncing"&&<span style={{fontSize:10,color:"#f59e0b"}}>⟳</span>}
            {syncStatus==="ok"&&<span style={{fontSize:10,color:"#00c864"}}>✓ nuvem</span>}
            {syncStatus==="err"&&<span style={{fontSize:10,color:"#f87171"}}>⚠ offline</span>}
          </div>
        </div>
        {tab==="home"&&<button onClick={()=>setEditPlan("new")} style={{padding:"8px 14px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#00b4d8,#00e5ff)",color:"#000",fontWeight:700,cursor:"pointer",fontSize:14}}>+ Treino</button>}
      </div>
      <div style={{display:"flex",overflowX:"auto",scrollbarWidth:"none"}}>
        {[["home","🏠"],["agenda","📅"],["alunos","👥"],["avaliacao","📏"],["meudia","⚡"],["history","📋"],["progress","📈"],["volume","📊"]].map(([id,icon])=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:"0 0 auto",padding:"8px 12px",border:"none",background:"transparent",color:tab===id?"#00e5ff":"#2a5a7a",fontSize:18,cursor:"pointer",borderBottom:`2px solid ${tab===id?"#00e5ff":"transparent"}`,position:"relative"}}>
            {icon}
            {id==="alunos"&&alertas>0&&<span style={{position:"absolute",top:4,right:6,width:7,height:7,borderRadius:"50%",background:"#00c864"}}/>}
          </button>
        ))}
      </div>
    </div>

    <div style={{padding:"18px 18px"}}>
      {tab==="home"&&<>
        {resumeData&&<div style={{background:"rgba(234,179,8,0.09)",border:"1px solid #eab30844",borderRadius:16,padding:16,marginBottom:14}}>
          <div style={{fontSize:14,fontWeight:700,color:"#eab308",marginBottom:4}}>⚡ Treino em andamento</div>
          <div style={{fontSize:13,color:"#aaa",marginBottom:10}}>Você saiu do treino "{resumeData.planName}" sem finalizar.</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{ls("fl_workout_inprogress",null);setResumeData(null);}} style={{flex:1,padding:"10px",borderRadius:10,border:"1px solid #2a3a4a",background:"transparent",color:"#4a7a9b",cursor:"pointer",fontSize:13}}>Descartar</button>
            <button onClick={()=>{
              const p=plans.find(x=>x.id===resumeData.planId);
              if(p){setActiveWorkout({...p,_resume:resumeData});}
              setResumeData(null);
            }} style={{flex:2,padding:"10px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#eab308,#f59e0b)",color:"#000",fontWeight:700,cursor:"pointer",fontSize:13}}>▶ Continuar treino</button>
          </div>
        </div>}
        {daysSince>=5&&<div style={{background:"rgba(239,68,68,0.08)",border:"1px solid #ef444433",borderRadius:14,padding:"12px 16px",marginBottom:14,display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:24}}>⚠️</span><div><div style={{fontSize:14,fontWeight:700,color:"#ef4444"}}>Alerta de destreino</div><div style={{fontSize:12,color:"#ef4444aa"}}>{daysSince} dias sem treinar. Bora voltar!</div></div>
        </div>}
        {todayPlans.length>0&&todayPlans.map(plan=><div key={plan.id} style={{background:"linear-gradient(135deg,#051a2e,#0a2a42)",border:"1px solid rgba(0,229,255,0.2)",borderRadius:20,padding:18,marginBottom:12}}>
          <div style={{fontSize:11,color:"#00b4d8",letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>📅 Hoje — {DAY_FULL[todayIdx]}</div>
          <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>{plan.name}</div>
          <div style={{fontSize:13,color:"#4a7a9b",marginBottom:12}}>{plan.exercises.length} exercícios · {plan.exercises.reduce((a,e)=>a+e.sets,0)} séries</div>
          <button onClick={()=>setPreTreino(plan)} style={{width:"100%",padding:13,borderRadius:14,border:"none",background:"linear-gradient(135deg,#00b4d8,#00e5ff)",color:"#000",fontSize:15,fontWeight:800,cursor:"pointer"}}>▶ Iniciar Treino de Hoje</button>
        </div>)}
        <div style={{display:"flex",gap:5,marginBottom:14,overflowX:"auto",paddingBottom:4,scrollbarWidth:"none"}}>
          {DAYS.map((d,i)=>{
            const ps=plans.filter(p=>(p.trainingDays||[p.dayIndex]).includes(i));
            const done=sessions.some(s=>{const sd=new Date(s.date+"T12:00");return ps.some(p=>s.planId===p.id)&&(new Date()-sd)/86400000<7&&sd.getDay()===i;});
            const isToday=i===todayIdx;
            return <div key={i} style={{flex:"0 0 auto",textAlign:"center",minWidth:40}}>
              <div style={{fontSize:9,color:isToday?"#00e5ff":"#2a5a7a",marginBottom:4}}>{d}</div>
              <div style={{width:40,height:40,borderRadius:10,background:done?"rgba(0,200,100,0.12)":ps.length>0?"rgba(0,229,255,0.07)":"#0a1628",border:`1px solid ${isToday?"rgba(0,229,255,0.5)":done?"rgba(0,200,100,0.3)":ps.length>0?"rgba(0,229,255,0.15)":"#0e2035"}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {done?<span style={{fontSize:16}}>✓</span>:ps.length>0?<span style={{fontSize:14}}>💪</span>:<span style={{fontSize:14,color:"#1a3a4a"}}>—</span>}
              </div>
            </div>;
          })}
        </div>
        <div style={{fontSize:11,color:"#4a7a9b",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>Seus Treinos</div>
        {sortedPlans.map(plan=>{
          const lastS=sessions.filter(s=>s.planId===plan.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
          const daysAgo=lastS?Math.round((new Date()-new Date(lastS.date+"T12:00"))/86400000):null;
          const trainDays=(plan.trainingDays||[plan.dayIndex]).map(i=>DAYS[i]).join("/");
          const lastType=lastS?WORKOUT_TYPES.find(t=>t.id===lastS.workoutType):null;
          return <div key={plan.id} style={{background:"#0a1628",border:"1px solid #0e2035",borderRadius:16,padding:"13px 16px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:4,flexWrap:"wrap"}}>
                  <span style={{fontSize:11,background:"rgba(0,180,216,0.15)",color:"#00b4d8",padding:"2px 8px",borderRadius:20}}>{trainDays}</span>
                  {lastType&&<span style={{fontSize:14}}>{lastType.emoji}</span>}
                  {daysAgo===0&&<span style={{fontSize:10,color:"#00c864"}}>feito hoje ✓</span>}
                  {daysAgo===1&&<span style={{fontSize:10,color:"#4a7a9b"}}>ontem</span>}
                  {daysAgo>1&&<span style={{fontSize:10,color:"#2a5a7a"}}>{daysAgo}d atrás</span>}
                </div>
                <div style={{fontSize:16,fontWeight:700}}>{plan.name}</div>
                <div style={{fontSize:12,color:"#4a7a9b",marginTop:2}}>{plan.exercises.length} exercícios</div>
              </div>
              <div style={{display:"flex",gap:5}}>
                <button onClick={()=>setProgressPlan(plan)} style={{padding:"6px 8px",borderRadius:8,border:"1px solid #0e2035",background:"transparent",color:"#4a7a9b",cursor:"pointer",fontSize:13}}>📈</button>
                <button onClick={()=>setEditPlan(plan)} style={{padding:"6px 8px",borderRadius:8,border:"1px solid #0e2035",background:"transparent",color:"#4a7a9b",cursor:"pointer",fontSize:13}}>✏️</button>
                <button onClick={()=>deletePlan(plan.id)} style={{padding:"6px 8px",borderRadius:8,border:"1px solid #0e2035",background:"transparent",color:"#4a7a9b",cursor:"pointer",fontSize:13}}>🗑</button>
              </div>
            </div>
            <div style={{display:"flex",gap:5,marginTop:10,overflowX:"auto",paddingBottom:2,scrollbarWidth:"none"}}>
              {plan.exercises.map(ex=>{
                const exLogs=logs.filter(l=>l.exerciseId===ex.id).sort((a,b)=>a.date.localeCompare(b.date));
                const wts=exLogs.map(l=>Math.max(...l.sets.map(s=>parseFloat(s.weight)||0),0));
                const lastW=wts.at(-1),prevW=wts.at(-2);const up=prevW!==undefined&&lastW>prevW;
                return <div key={ex.id} style={{flex:"0 0 auto",background:"#060d18",borderRadius:9,padding:"5px 9px",border:`1px solid ${up?"#0d3a1a":"#0e2035"}`}}>
                  <div style={{fontSize:11,color:up?"#00c864":"#aaa",fontWeight:600,whiteSpace:"nowrap"}}>{up?"▲ ":""}{ex.name}</div>
                  <div style={{display:"flex",alignItems:"center",gap:5,marginTop:1}}>
                    {lastW?<span style={{fontSize:13,fontWeight:700,color:"#00e5ff"}}>{lastW}kg</span>:<span style={{fontSize:11,color:"#2a5a7a"}}>—</span>}
                    {wts.length>=2&&<Sparkline data={wts.slice(-6)} width={38} height={15} color={up?"#00c864":"#00b4d8"}/>}
                  </div>
                </div>;
              })}
            </div>
            <button onClick={()=>setPreTreino(plan)} style={{width:"100%",marginTop:10,padding:11,borderRadius:12,border:"none",background:(plan.trainingDays||[plan.dayIndex]).includes(todayIdx)?"linear-gradient(135deg,#00b4d8,#00e5ff)":"rgba(0,180,216,0.1)",color:(plan.trainingDays||[plan.dayIndex]).includes(todayIdx)?"#000":"#00b4d8",fontSize:14,fontWeight:700,cursor:"pointer"}}>▶ Iniciar</button>
          </div>;
        })}
        {plans.length===0&&<div style={{textAlign:"center",padding:"40px 20px",color:"#2a5a7a"}}><div style={{fontSize:48,marginBottom:10}}>💪</div><div style={{fontSize:15,fontWeight:600,marginBottom:6}}>Nenhum treino ainda</div><div style={{fontSize:13}}>Toque em "+ Treino"</div></div>}
      </>}
      {tab==="history"&&<HistoryView sessions={sessions} logs={logs} onDelete={deleteSession}/>}
      {tab==="progress"&&<ProgressView plan={plans[0]} logs={logs} sessions={sessions} plans={plans} students={students}/>}
      {tab==="volume"&&<VolumeView plans={plans}/>}
      {tab==="meudia"&&<MeuDiaView habitos={habitos} tarefas={tarefas} metas={metas} onHabitos={syncHabitos} onTarefas={syncTarefas} onMetas={syncMetas}/>}
      {tab==="agenda"&&<AgendaView students={students} onUpdate={updateStudent} gsUrl={GS_URL}/>}
      {tab==="avaliacao"&&<AvaliacaoView students={students} onUpdate={updateStudent}/>}
      {tab==="financeiro"&&<FinanceiroView students={students} onUpdate={updateStudent}/>}
      {tab==="alunos"&&<>
        <div style={{background:"#0a1628",border:"1px solid #0e2035",borderRadius:14,padding:"12px 14px",marginBottom:14}}>
          <div style={{fontSize:10,color:"#4a7a9b",letterSpacing:1,marginBottom:6}}>MEU PIX</div>
          <input value={meuPix} onChange={e=>savePix(e.target.value)} placeholder="CPF, telefone, e-mail ou chave aleatória"
            style={{width:"100%",background:"#060d18",border:"1px solid #0e2035",borderRadius:10,padding:"10px 12px",color:"#fff",fontSize:14,outline:"none"}}/>
        </div>
        <AlunosView students={students} onUpdate={updateStudent} onAdd={addStudent} onDelete={deleteStudent} meuPix={meuPix}/>
      </>}
    </div>

    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:960,background:"#0a1628",borderTop:"1px solid #0e2035",display:"flex",padding:"8px 0 12px"}}>
      {[["home","🏠","Plano"],["agenda","📅","Agenda"],["alunos","👥","Alunos"],["meudia","⚡","Meu Dia"],["financeiro","💰","R$"]].map(([id,icon,lbl])=>(
      <button key={id} onClick={()=>setTab(id)} style={{flex:1,background:"none",border:"none",cursor:"pointer",color:tab===id?"#00e5ff":"#2a5a7a",display:"flex",flexDirection:"column",alignItems:"center",gap:1,position:"relative"}}>
          <span style={{fontSize:18}}>{icon}</span>
          <span style={{fontSize:10,fontWeight:tab===id?700:400}}>{lbl}</span>
          {tab===id && <div style={{position:"absolute",top:-8,width:4,height:4,borderRadius:10,background:"#00e5ff"}}/>}
        </button>
      ))}
    </div>
  </div>;
}

// ── RENDERIZAÇÃO FINAL ───────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
