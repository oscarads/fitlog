  if(screen==="configurar"&&student) return <div style={{paddingBottom:80}}>

    {Object.entries(CAT_LABELS).map(([cat,catLabel])=>(

          const ativa=medidasAtivas.includes(m.id);
          return <div key={m.id} onClick={()=>toggleMedida(m.id)}

// ── CALCULADOR DE PACOTE REAL ────────────────────────────────────────────────
// CALC PACOTE - conta exatamente quantas aulas cabem no mes pelos dias escolhidos
function PacoteCalc({onAplicar, pacoteAtual, diasSemana}){
  const now=new Date();
  const DIAS_LABEL=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  // Usa os dias já configurados no cadastro do aluno
  const diasSel=diasSemana&&diasSemana.length>0?diasSemana:[1,3];
  const [mesSel,setMesSel]=useState("atual");

  const calcular=()=>{
    if(diasSel.length===0) return 0;
    const ano=now.getFullYear();
    const mes=now.getMonth()+1;
    const proxAno=mes===12?ano+1:ano;
    const proxMes=mes===12?1:mes+1;
    if(mesSel==="atual")   return calcPacoteReal(ano,mes,diasSel,false);
    if(mesSel==="resto")   return calcPacoteReal(ano,mes,diasSel,true);
    if(mesSel==="proximo") return calcPacoteReal(proxAno,proxMes,diasSel,false);
    return 0;
  };

  const aulas=calcular();
  const mesNomeAtual=MONTHS[now.getMonth()]+" "+now.getFullYear();
  const proxM=now.getMonth()===11?0:now.getMonth()+1;
  const mesNomeProx=MONTHS[proxM]+(now.getMonth()===11?" "+(now.getFullYear()+1):" "+now.getFullYear());

  return <div style={{background:"#0a1628",border:"1px solid #1a3a5a",borderRadius:14,marginBottom:12,overflow:"hidden"}}>
    <div style={{padding:"12px 14px",borderBottom:"1px solid #0e2035"}}>
      <div style={{fontSize:11,color:"#4a9ebb",letterSpacing:1}}>📊 CALCULAR PACOTE REAL</div>
      <div style={{fontSize:11,color:"#2a5a7a",marginTop:2}}>
        {diasSel.length>0?`${diasSel.map(d=>DIAS_LABEL[d]).join(", ")} · baseado nos dias acima`:"Configure os dias acima"}
      </div>
    </div>
    <div style={{padding:"10px 14px"}}>
      {/* Período */}
      <div style={{display:"flex",gap:5,marginBottom:12}}>
        {[
          ["atual",   `Mês completo\n${mesNomeAtual}`],
          ["resto",   `Resto do mês\n(a partir de hoje)`],
          ["proximo", `Próximo mês\n${mesNomeProx}`],
        ].map(([v,lbl])=><button key={v} onClick={()=>setMesSel(v)}
          style={{flex:1,padding:"8px 4px",borderRadius:10,border:`2px solid ${mesSel===v?"#00e5ff":"#0e2035"}`,
            background:mesSel===v?"rgba(0,229,255,0.12)":"transparent",
            color:mesSel===v?"#00e5ff":"#4a7a9b",fontSize:10,fontWeight:mesSel===v?700:400,cursor:"pointer",
            lineHeight:1.4,whiteSpace:"pre-line"}}>
          {lbl}
        </button>)}
      </div>
      {/* Resultado */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
        background:"rgba(0,229,255,0.07)",border:"1px solid rgba(0,229,255,0.2)",borderRadius:12,padding:"12px 16px",marginBottom:10}}>
        <span style={{fontSize:13,color:"#4a9ebb"}}>
          {diasSel.map(d=>DIAS_LABEL[d]).join(", ")} · {mesSel==="atual"?mesNomeAtual:mesSel==="resto"?"resto de "+mesNomeAtual:mesNomeProx}
        </span>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:36,fontWeight:900,color:"#00e5ff",lineHeight:1}}>{aulas}</div>
          <div style={{fontSize:11,color:"#4a9ebb"}}>aulas</div>
        </div>
      </div>
      <button onClick={()=>aulas>0&&onAplicar(aulas)}
        style={{width:"100%",padding:"11px",borderRadius:11,border:"none",
          background:aulas>0?"linear-gradient(135deg,#00b4d8,#00e5ff)":"#0e2035",
          color:aulas>0?"#000":"#2a5a7a",fontSize:13,fontWeight:800,cursor:aulas>0?"pointer":"default"}}>
        {aulas>0?`Aplicar ${aulas} aulas ao pacote`:"Configure os dias acima primeiro"}
      </button>
    </div>
  </div>;
}

function AlunoForm({aluno,onSave,onCancel}){

    const dias=d.diasSemana||[];
    if(!dias.length) return 0;
    const fim=new Date(ano,mes+1,0);let n=0;
    for(let dt=new Date(ano,mes,1);dt<=fim;dt.setDate(dt.getDate()+1))
      if(dias.includes(dt.getDay())) n++;
    return n;
  };
  const aulasMes=calcAulasMes(now.getFullYear(),now.getMonth());
  const proxMes=now.getMonth()===11?0:now.getMonth()+1;
  const proxAno=now.getMonth()===11?now.getFullYear()+1:now.getFullYear();

      <input value={d.nome} onChange={e=>setD(x=>({...x,nome:e.target.value}))}

        style={{width:"100%",background:"#0a1628",border:"1px solid #0e2035",borderRadius:12,
          padding:"13px 14px",color:"#fff",fontSize:16,fontWeight:600,outline:"none"}}/>

        onChange={e=>setD(x=>({...x,whatsapp:e.target.value.replace(/\D/g,"")}))}

        style={{width:"100%",background:"#0a1628",border:"1px solid #0e2035",borderRadius:12,

        {[["poraula","Por aula"],["fixo","Pacote fixo"]].map(([v,l])=>(

            style={{flex:1,padding:"10px",borderRadius:10,cursor:"pointer",fontSize:13,fontWeight:600,
              border:`1px solid ${(d.modeloPag||"poraula")===v?"#00e5ff":"#0e2035"}`,

        return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[
            {lbl:"Resto do mês",n:resto,c:"#00b4d8",sub:`até dia ${new Date(fimMesStr+"T12:00").getDate()}`},
            {lbl:"Próximos 30 dias",n:prox,c:"#8b5cf6",sub:`até ${new Date(proxFim+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short"})}`},
            {lbl:MONTHS[now.getMonth()]+" (mês todo)",n:aulasMes,c:"#00c864",sub:`${aulasMes} aulas`},
            {lbl:MONTHS[proxMes]+" (próximo)",n:aulasMesProx,c:"#f59e0b",sub:`${aulasMesProx} aulas`},
          ].map(({lbl,n,c,sub})=>(
            <div key={lbl} style={{textAlign:"center",background:"#060d18",borderRadius:10,
              padding:"10px 6px",border:`1px solid ${c}22`}}>
              <div style={{fontSize:9,color:"#4a7a9b",marginBottom:2}}>{lbl}</div>
              <div style={{fontSize:24,fontWeight:900,color:c}}>{n}</div>
              <div style={{fontSize:10,color:"#2a5a7a"}}>R${n*(d.valorAula||0)}</div>
            </div>
          ))}
        </div>;
      })()}
    </div>}

    <div style={{display:"flex",gap:10}}>
      <button onClick={onCancel} style={{flex:1,padding:14,borderRadius:12,
        border:"1px solid #0e2035",background:"transparent",color:"#4a7a9b",cursor:"pointer"}}>
        Cancelar
      </button>
      <button onClick={()=>valid&&onSave(d)} style={{flex:2,padding:14,borderRadius:12,
        border:"none",fontSize:15,fontWeight:800,cursor:valid?"pointer":"default",
        background:valid?"linear-gradient(135deg,#00b4d8,#00e5ff)":"#0e2035",
        color:valid?"#000":"#2a5a7a"}}>
        Salvar
      </button>
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════
// SEÇÃO 11: BLOCO DE COBRANÇA
// Props: s (aluno), dadas (aulas feitas), mesAtual, onUpdate
// Lógica:
//   pacotePago = total pago pelo aluno (vem do X/Y da agenda)
//   restantes  = pacotePago - dadas
//   concluido  = dadas >= pacotePago → sugere cobrar mais
// Telas: principal → cobrar → relatório
// ═══════════════════════════════════════════════════
function CobrancaBlock({s,dadas,mesAtual,onUpdate,setSelected,meuPix}){
  const now=new Date();
  const valorAula=parseFloat(s.valorAula)||0;
  const pacotePago=parseInt(s.pacotePago)||0;
  const restantes=Math.max(0,pacotePago-dadas);
  const concluido=pacotePago>0&&dadas>=pacotePago;

  const vig=getVigencia(s);
  const hoje=todayStr();
  const temDias=(s.diasSemana||[]).length>0;

  // ── OPÇÃO A: Resto do mês atual (hoje → último dia do mês)
  const fimMes=new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().slice(0,10);
  const aulasRestoMes=temDias?calcAulasPeriodo(hoje,fimMes,s.diasSemana):0;

  // ── OPÇÃO B: Próximo período (hoje → mesmo dia mês seguinte)
  const fimProxPeriodo=mesmoDiaMesSeguinte(hoje);
  const aulasProxPeriodo=temDias?calcAulasPeriodo(hoje,fimProxPeriodo,s.diasSemana):0;

  const fmtVig=(inicio,fim)=>{
    const fI=new Date(inicio+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short"});
    const fF=new Date(fim+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short",year:"numeric"});
    return `${fI} – ${fF}`;
  };

  const [modo,setModo]=useState(null);
  const [qtd,setQtd]=useState("");
  const [tipoCobranca,setTipoCobranca]=useState("proximo"); // "resto" | "proximo"
  const [confirmado,setConfirmado]=useState(false);

  const periodoSel=tipoCobranca==="resto"
    ?{fim:fimMes,      aulas:aulasRestoMes,  label:"Resto do mês"}
    :{fim:fimProxPeriodo,aulas:aulasProxPeriodo,label:"Próximos 30 dias"};

  const vQtd=(parseInt(qtd)||0)*valorAula;

  const registrarPagamento=(numAulas)=>{
    const v=numAulas*valorAula;
    const novaVigInicio=hoje;
    const novaVigFim=periodoSel.fim;
    const pag={id:uid(),data:hoje,valor:v,aulas:numAulas,mes:mesAtual,
      vigenciaInicio:novaVigInicio,vigenciaFim:novaVigFim};
    // Reseta aulaAtual para 0 → próxima aula marcada começa do 1
    // pacotePago = novo pacote contratado
    const updated={...s,
      pacotePago:numAulas,
      vigenciaInicio:novaVigInicio,
      vigenciaFim:novaVigFim,
      pagamentos:[...(s.pagamentos||[]),pag]};
    onUpdate(updated);setSelected(updated);
    setModo(null);setQtd("");setConfirmado(false);
  };

  const wpp=(txt)=>{
    const num=(s.whatsapp||"").replace(/\D/g,"");
    if(!num){alert("Adicione o WhatsApp do aluno.");return;}
    window.open(`https://wa.me/55${num}?text=${encodeURIComponent(txt)}`,"_blank");
  };

  // Relatório das aulas feitas
  const gerarRelatorio=()=>{
    const feitas=(s.aulas||[]).filter(a=>a.presente).sort((a,b)=>a.data.localeCompare(b.data));
    if(!feitas.length) return "Nenhuma aula registrada ainda.";
    const pacote=parseInt(s.pacotePago)||0;
    const lista=pacote>0&&feitas.length>pacote?feitas.slice(-pacote):feitas;
    const linhas=lista.map((a,i)=>{
      const d=new Date(a.data+"T12:00");
      return (i+1)+". "+d.toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    });
    const info=pacote>0
      ?"\n\n"+lista.length+"/"+pacote+" aulas"+(valorAula>0?" · R$"+lista.length*valorAula:"")
      :"\n\nTotal: "+lista.length+" aulas"+(valorAula>0?" · R$"+lista.length*valorAula:"");
        return "Aulas feitas — "+s.nome+"\n\n"+linhas.join("\n")+info;
  };

  // ── Tela: cobrar ─────────────────────────────────────────────────────────
  if(modo==="cobrar") return(
    <div style={{background:"#0a1628",border:"1px solid #00b4d8",borderRadius:16,padding:16,marginBottom:8}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <button onClick={()=>{setModo(null);setQtd("");setConfirmado(false);}}
          style={{background:"none",border:"none",color:"#4a7a9b",fontSize:22,cursor:"pointer",padding:0}}>←</button>
        <div>
          <div style={{fontSize:14,fontWeight:700}}>Cobrar — {s.nome}</div>
          <div style={{fontSize:11,color:"#4a7a9b"}}>{fmtVig(hoje,periodoSel.fim)}</div>
        </div>
      </div>

      {/* Toggle: Resto do mês vs Próximos 30 dias */}
      <div style={{display:"flex",gap:6,marginBottom:12}}>
        {[["resto","🗓 Resto do mês"],["proximo","📅 Próximos 30 dias"]].map(([k,l])=>(
          <button key={k} onClick={()=>{setTipoCobranca(k);setQtd("");}}
            style={{flex:1,padding:"9px",borderRadius:10,cursor:"pointer",fontSize:12,fontWeight:700,
              border:`1px solid ${tipoCobranca===k?"#00b4d8":"#0e2035"}`,
              background:tipoCobranca===k?"rgba(0,180,216,0.15)":"transparent",
              color:tipoCobranca===k?"#00b4d8":"#4a7a9b"}}>
            {l}
          </button>
        ))}
      </div>

      {/* Banner calculado automaticamente (se tem dias configurados) */}
      {temDias&&periodoSel.aulas>0?
        <div style={{background:"rgba(0,180,216,0.08)",border:"1px solid #00b4d844",
          borderRadius:12,padding:"10px 14px",marginBottom:12}}>
          <div style={{fontSize:10,color:"#4a7a9b",marginBottom:3,letterSpacing:1}}>
            {periodoSel.label.toUpperCase()} · CALCULADO AUTOMÁTICO
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <span style={{fontSize:26,fontWeight:900,color:"#00e5ff"}}>{periodoSel.aulas}</span>
              <span style={{fontSize:12,color:"#4a7a9b"}}> aulas · até {new Date(periodoSel.fim+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short"})}</span>
            </div>
            {valorAula>0&&<div style={{fontSize:18,fontWeight:800,color:"#00c864"}}>R${periodoSel.aulas*valorAula}</div>}
          </div>
        </div>:
        <div style={{background:"rgba(234,179,8,0.06)",border:"1px solid #eab30833",borderRadius:10,
          padding:"8px 12px",marginBottom:12,fontSize:11,color:"#eab308"}}>
          ⚠️ Configure os dias da semana no cadastro para calcular automaticamente.
        </div>}

      {/* Atalhos rápidos */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[temDias&&periodoSel.aulas,restantes>0&&restantes,8,10,12,16,20]
          .filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).slice(0,6).map(n=>(
          <button key={n} onClick={()=>setQtd(String(n))}
            style={{padding:"6px 14px",borderRadius:20,cursor:"pointer",fontSize:12,
              border:`1px solid ${qtd==n?"#00e5ff":"#0e2035"}`,
              background:qtd==n?"rgba(0,229,255,0.12)":"transparent",
              color:qtd==n?"#00e5ff":"#4a7a9b",fontWeight:qtd==n?700:400}}>
            {n}{n===periodoSel.aulas&&temDias?" ✓":n===restantes&&restantes?" (restam)":""}
          </button>
        ))}
      </div>

      <input type="number" inputMode="numeric" value={qtd}
        onChange={e=>setQtd(e.target.value)} placeholder="Quantas aulas?"
        style={{width:"100%",background:"#060d18",border:"1px solid #00b4d8",borderRadius:10,
          padding:"12px 14px",color:"#fff",fontSize:24,fontWeight:900,outline:"none",marginBottom:8}}/>

      {qtd&&valorAula>0&&<div style={{background:"rgba(0,180,216,0.08)",borderRadius:10,
        padding:"12px 14px",marginBottom:12,textAlign:"center"}}>
        <div style={{fontSize:11,color:"#4a7a9b",marginBottom:4}}>{qtd} aulas × R${valorAula}</div>
        <div style={{fontSize:36,fontWeight:900,color:"#00e5ff"}}>R${vQtd}</div>
        {meuPix&&<div style={{fontSize:11,color:"#4a7a9b",marginTop:4}}>Pix: {meuPix}</div>}
      </div>}

      {!confirmado?<div style={{display:"flex",gap:8}}>
        <button onClick={()=>qtd&&wpp(
          `Olá ${s.nome}, tudo bem? 😊\n\nPassando para te lembrar sobre o pagamento das suas aulas!\n\n` +
          `📋 *${parseInt(qtd)} aulas* · ${fmtVig(hoje,periodoSel.fim)}\n` +
          `💰 Valor: *R$ ${vQtd}*\n` +
          (meuPix?`💳 Pix: *${meuPix}*\n`:``) +
          `\nQualquer dúvida é só me chamar! Abraços 💪`
        )} style={{flex:1,padding:"11px",borderRadius:10,border:"none",
          background:"linear-gradient(135deg,#25d366,#128c7e)",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>
          📱 WhatsApp
        </button>
        <button onClick={()=>setConfirmado(true)}
          disabled={!qtd||parseInt(qtd)<=0}
          style={{flex:1,padding:"11px",borderRadius:10,border:"none",fontWeight:700,
            background:qtd&&parseInt(qtd)>0?"linear-gradient(135deg,#00c864,#00e5aa)":"#0e2035",
            color:qtd&&parseInt(qtd)>0?"#000":"#2a5a7a",cursor:"pointer"}}>
          ✓ Recebi!
        </button>
      </div>:
      <div>
        <div style={{background:"rgba(0,200,100,0.1)",borderRadius:12,padding:14,marginBottom:10,textAlign:"center"}}>
          <div style={{fontSize:14,fontWeight:700,color:"#00c864"}}>✓ Pagamento registrado</div>
          <div style={{fontSize:12,color:"#aaa",marginTop:4}}>{fmtVig(hoje,periodoSel.fim)} · {qtd} aulas</div>
        </div>
        <button onClick={()=>registrarPagamento(parseInt(qtd))}
          style={{width:"100%",padding:"12px",borderRadius:10,border:"none",
            background:"linear-gradient(135deg,#00b4d8,#00e5ff)",
            color:"#000",fontSize:14,fontWeight:800,cursor:"pointer"}}>
          Confirmar e fechar
        </button>
      </div>}
    </div>
  );

  // ── Tela: relatório ───────────────────────────────────────────────────────
  if(modo==="relatorio") return(
    <div style={{background:"#0a1628",border:"1px solid #0e2035",borderRadius:16,padding:16,marginBottom:8}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <button onClick={()=>setModo(null)}
          style={{background:"none",border:"none",color:"#4a7a9b",fontSize:22,cursor:"pointer",padding:0}}>←</button>
        <div style={{fontSize:14,fontWeight:700}}>Relatório — {s.nome}</div>
      </div>
      <div style={{background:"#060d18",borderRadius:12,padding:12,marginBottom:12,
        fontSize:12,color:"#aaa",lineHeight:1.8,whiteSpace:"pre-wrap"}}>
        {gerarRelatorio()}
      </div>
      <button onClick={()=>wpp(gerarRelatorio())}
        style={{width:"100%",padding:"11px",borderRadius:10,border:"none",
          background:"linear-gradient(135deg,#25d366,#128c7e)",
          color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>
        📱 Enviar por WhatsApp
      </button>
    </div>
  );

  // ── Tela principal ────────────────────────────────────────────────────────
  return <div style={{background:"#0a1628",border:"1px solid #0e2035",borderRadius:16,padding:14,marginBottom:8}}>
    <div style={{fontSize:11,color:"#4a7a9b",letterSpacing:1,marginBottom:4}}>💰 {s.nome}</div>
    {vig.inicio&&<div style={{fontSize:10,color:"#2a5a7a",marginBottom:10}}>
      Período: {fmtVig(vig.inicio,vig.fim)}
    </div>}

    {!valorAula&&<div style={{fontSize:12,color:"#f59e0b",background:"rgba(234,179,8,0.08)",
      borderRadius:8,padding:"8px 10px",marginBottom:10}}>
      ⚠️ Configure o valor por aula no cadastro
    </div>}

    {/* Resumo: feitas / pacote pago + faltas */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
      {[
        {l:"Consumidas",v:dadas,c:"#00c864",sub:pacotePago>0?`${Math.round((dadas/pacotePago)*100)}%`:""},
        {l:"Pacote",v:pacotePago,c:pacotePago>0?"#00b4d8":"#4a7a9b",sub:valorAula&&pacotePago?`R$${pacotePago*valorAula}`:"—"},
        {l:"Restam",v:restantes,c:restantes>0?"#eab308":concluido?"#00c864":"#4a7a9b",
          sub:concluido?"✓ cobrar":restantes>0?"a usar":"—"},
      ].map(({l,v,c,sub})=>(
        <div key={l} style={{background:"#060d18",borderRadius:10,padding:"8px",
          textAlign:"center",border:"1px solid #0e2035"}}>
          <div style={{fontSize:9,color:"#4a7a9b",marginBottom:2}}>{l}</div>
          <div style={{fontSize:22,fontWeight:900,color:c}}>{v}</div>
          {sub&&<div style={{fontSize:10,color:"#2a5a7a"}}>{sub}</div>}
        </div>
      ))}
    </div>

    {/* Alerta quando usou tudo */}
    {concluido&&<div style={{background:"rgba(0,229,255,0.08)",border:"1px solid #00e5ff44",
      borderRadius:10,padding:"10px 12px",marginBottom:10}}>
      <div style={{fontSize:13,fontWeight:700,color:"#00e5ff",marginBottom:4}}>
        🎉 Pacote completo! Hora de cobrar.
      </div>
      <div style={{fontSize:11,color:"#4a7a9b"}}>
        {temDias&&aulasRestoMes>0
          ?`Resto do mês: ${aulasRestoMes} aulas · até ${new Date(fimMes+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short"})}`
          :temDias&&aulasProxPeriodo>0
          ?`Próximos 30 dias: ${aulasProxPeriodo} aulas`
          :"Configure os dias da semana para calcular automaticamente."}
      </div>
    </div>}

    {/* Botões */}
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      <button onClick={()=>setModo("cobrar")}
        style={{padding:"13px 16px",borderRadius:11,border:"none",cursor:"pointer",
          background:concluido?"linear-gradient(135deg,#00b4d8,#00e5ff)":"linear-gradient(135deg,rgba(0,180,216,0.2),rgba(0,229,255,0.1))",
          color:concluido?"#000":"#00b4d8",fontSize:13,fontWeight:700}}>
        💰 {concluido
          ?temDias&&aulasRestoMes>0
            ?`Cobrar resto do mês — ${aulasRestoMes} aulas · R$${aulasRestoMes*valorAula}`
            :"Cobrar próximo pacote"
          :"Cobrar aulas"}
      </button>
      <button onClick={()=>setModo("relatorio")}
        style={{padding:"11px 16px",borderRadius:11,border:"1px solid #0e2035",cursor:"pointer",
          background:"transparent",color:"#4a7a9b",fontSize:12}}>
        📋 Ver relatório das {dadas} aulas
      </button>
    </div>
  </div>;
}


// ALUNOS VIEW - listagem, check de aulas, cobranca
// Pagamento: "completo" zera mes | "parcial" continua contando
// ═══════════════════════════════════════════════════
// SEÇÃO 12: ABA ALUNOS (👥)
// Screens: list → detail → form-new → form-edit
// marcarAula: registra aula feita/falta em data específica
// toggleAula: chamado pela agenda — se título "X/Y":
//   reconstrói X sessões retroativas E define pacotePago=Y
// ═══════════════════════════════════════════════════
function AlunosView({students,onUpdate,onAdd,onDelete,meuPix}){
  const [screen,setScreen]=useState("list");
  const [selected,setSelected]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [dtAdd,setDtAdd]=useState(todayStr());

  const [confirm,setConfirm]=useState(null);
  const now=new Date();
  const mesAtual=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const mesNome=`${MONTHS_PT[now.getMonth()]} ${now.getFullYear()}`;

  const aulasDoMes=s=>(s.aulas||[]).filter(a=>a.data&&a.data.startsWith(mesAtual));
  // Aulas dentro da vigência (período de cobrança) — falta CONTA como aula consumida
  const aulasDoPeriodo=s=>{const{inicio,fim}=getVigencia(s);return(s.aulas||[]).filter(a=>a.data&&a.data>=inicio&&a.data<=fim);};
  const aulasDadas=s=>(s.aulas||[]).filter(a=>a.data>=getPackageStart(s)).length;
  const aulasFeitas=s=>(s.aulas||[]).filter(a=>a.data>=getPackageStart(s)&&a.presente).length;
  const faltasDoMes=s=>(s.aulas||[]).filter(a=>a.data>=getPackageStart(s)&&!a.presente).length;
  const creditosMes=s=>{
    if(!s.carryOver)return 0;
    const mesPrev=new Date(now.getFullYear(),now.getMonth()-1,1);
    const mpStr=`${mesPrev.getFullYear()}-${String(mesPrev.getMonth()+1).padStart(2,"0")}`;
    const feitasPrev=(s.aulas||[]).filter(a=>a.data.startsWith(mpStr)&&a.presente).length;
    return Math.max(0,(s.pacote||8)-feitasPrev);
  };
  const totalMes=s=>{
    // Prioriza pacotePago (definido pelo título da agenda ou pelo cadastro)
    if(parseInt(s.pacotePago)>0) return parseInt(s.pacotePago);
    // Fallback: dias da semana configurados
    const v=getVigencia(s);
    if((s.diasSemana||[]).length>0) return calcAulasPeriodo(v.inicio,v.fim,s.diasSemana)||s.creditos||8;
    return s.creditos||8;
  };

  // ✓ = aula feita (conta no pacote)
  // ✗ = falta (conta no pacote — você estava disponível)
  // Para não cobrar: use o botão ↺ para remover o registro
  const marcarAula=(s,presente,data)=>{
    const ds=data||todayStr();
    const aula={id:uid(),data:ds,presente};
    // Créditos são absolutos — não decrementam por aula marcada
    const updated={...s,aulas:[...(s.aulas||[]).filter(a=>a.data!==ds),aula]};
    onUpdate(updated);if(selected?.id===s.id)setSelected(updated);
  };

  const gerarRelatorio=s=>{
    const dadas=aulasDadas(s),faltas=faltasDoMes(s),total=totalMes(s);
    const feitas=aulasFeitas(s);
    const cred=creditosMes(s);
    const vig=getVigencia(s);
    const aulas=aulasDoPeriodo(s).filter(a=>a.presente).sort((a,b)=>a.data.localeCompare(b.data));
    const lista=aulas.map((a,i)=>`  Aula ${i+1}: ${new Date(a.data+"T12:00").toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"})}`).join("\n");
    const pixLine=meuPix?`\n💳 *Pix:* ${meuPix}`:"";
    const credLine=cred>0?`\n_(inclui ${cred} crédito${cred>1?"s":""} do mês anterior)_`:"";
    const faltaLine=faltas>0?`\n⚠️ ${faltas} falta${faltas>1?"s":""} registrada${faltas>1?"s":""} (conta no pacote).`:"";
    const periodoLine=vig.inicio?`\n📅 Período: ${new Date(vig.inicio+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short"})} – ${new Date(vig.fim+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short",year:"numeric"})}`:("");
    const valorCobrar=(s.modeloCobranca||"fechado")==="mensal"
      ?(feitas*(s.valorAula||0))
      :s.valor;
    const cobrancaLine=dadas>=total
      ?`\n\n🎉 Pacote completo! Hora de renovar.\n💰 Valor: *R$ ${valorCobrar}*${pixLine}`
      :valorCobrar>0?`\n\n💰 Valor do mês: *R$ ${valorCobrar}*${pixLine}`:"";
    return `Olá ${s.nome}! 👋\n\nSuas aulas:${periodoLine}${credLine}\n\n${lista||"  (nenhuma aula registrada)"}\n\n✅ *${feitas} aulas feitas · ${dadas}/${total} do pacote.*${faltaLine}${cobrancaLine}\n\nQualquer dúvida estou à disposição! 💪`;
  };

  const enviarWpp=s=>{
    const num=s.whatsapp?.replace(/\D/g,"");
    if(!num){alert("Adicione o WhatsApp.");return;}
    window.open(`https://wa.me/55${num}?text=${encodeURIComponent(gerarRelatorio(s))}`,"_blank");
  };

  if(screen==="form-new")return <AlunoForm onSave={a=>{onAdd(a);setScreen("list");}} onCancel={()=>setScreen("list")}/>;
  if(screen==="form-edit"&&selected)return <AlunoForm aluno={selected} onSave={a=>{onUpdate(a);setSelected(a);setScreen("detail");}} onCancel={()=>setScreen("detail")}/>;

  if(screen==="detail"&&selected){
    const s=students.find(x=>x.id===selected.id)||selected;
    const dadas=aulasDadas(s),faltas=faltasDoMes(s),total=totalMes(s),cred=creditosMes(s);
    const creditos=Math.max(0,parseInt(s.creditos)||0);
    const aulasMes=(()=>{
      const dias=s.diasSemana||[];if(!dias.length)return total;
      const n=new Date(),fim=new Date(n.getFullYear(),n.getMonth()+1,0);let cnt=0;
      for(let dt=new Date(n.getFullYear(),n.getMonth(),1);dt<=fim;dt.setDate(dt.getDate()+1))
        if(dias.includes(dt.getDay()))cnt++;
      return cnt;
    })();
      // Progresso = aulas consumidas (feitas + faltas) / total do pacote
      const pacote=parseInt(s.pacotePago)||0;
      const totalReal=pacote>0?pacote:total;
      const pct=Math.min((dadas/Math.max(totalReal,1))*100,100);
      const completo=pacote>0&&dadas>=pacote;
      const feitas=aulasFeitas(s);
      const vig=getVigencia(s);
    const aulaHoje=(s.aulas||[]).some(a=>a.data===todayStr());
    const bColor=completo?"#00c864":faltas>0?"#ef4444":"#0e2035";
    return <div style={{paddingBottom:80}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={()=>setScreen("list")} style={{background:"none",border:"none",color:"#4a7a9b",fontSize:22,cursor:"pointer",padding:0}}>←</button>
          <div style={{width:40,height:40,borderRadius:12,background:`${bColor}22`,border:`1px solid ${bColor}55`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:800,color:bColor,flexShrink:0}}>{s.nome.charAt(0).toUpperCase()}</div>
          <div><div style={{fontSize:17,fontWeight:800}}>{s.nome}</div><div style={{fontSize:12,color:"#4a7a9b"}}>R${s.valorAula||"—"}/aula{(s.pacotePago||0)>0?" · "+s.pacotePago+" aulas":""}</div></div>
        </div>
        <button onClick={()=>{setSelected(s);setScreen("form-edit");}} style={{background:"none",border:"1px solid #0e2035",borderRadius:8,color:"#4a7a9b",padding:"6px 10px",cursor:"pointer",fontSize:14}}>✏️</button>
      </div>
      <div style={{background:"#0a1628",borderRadius:16,padding:16,border:`1px solid ${bColor}`,marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <div>
            <span style={{fontSize:24,fontWeight:900,color:completo?"#00c864":"#fff"}}>{dadas}<span style={{fontSize:14,color:"#4a7a9b",fontWeight:400}}> / {pacote||total}</span></span>
            {faltas>0&&<div style={{fontSize:11,color:"#ef4444",marginTop:2}}>✓ {feitas} feitas · ✗ {faltas} falta{faltas>1?"s":""}</div>}
          </div>
          <div style={{textAlign:"right"}}>
            {vig.inicio&&<div style={{fontSize:10,color:"#2a5a7a"}}>{new Date(vig.inicio+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short"})} – {new Date(vig.fim+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short"})}</div>}
            {completo&&<div style={{fontSize:13,fontWeight:700,color:"#00c864"}}>🎉 Cobrar!</div>}
          </div>
        </div>
        <div style={{height:10,background:"#0e2035",borderRadius:5,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${pct}%`,borderRadius:5,background:completo?"linear-gradient(90deg,#00c864,#00e5aa)":faltas>0?"linear-gradient(90deg,#ef4444,#f87171)":"linear-gradient(90deg,#00b4d8,#00e5ff)",transition:"width 0.5s"}}/>
        </div>
                {/* Pacote pago — linha simples */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
          <span style={{fontSize:12,color:"#4a7a9b"}}>
            {(s.pacotePago||0)>0?"Pacote: "+s.pacotePago+" aulas pagas":"Sem pacote definido ainda"}
          </span>
          {s.valorAula>0&&<span style={{fontSize:11,color:"#2a5a7a"}}>R${s.valorAula}/aula</span>}
        </div>
      </div>

      {/* Adicionar aula manual em qualquer data */}
      <div style={{marginBottom:8}}>
        {!showAdd
          ?<button onClick={()=>{setShowAdd(true);setDtAdd(todayStr());}}
            style={{width:"100%",padding:"8px",borderRadius:10,
              border:"1px dashed #0e2035",background:"transparent",
              color:"#4a7a9b",fontSize:12,cursor:"pointer"}}>
            + Registrar aula em data diferente
          </button>
          :<div style={{background:"#0a1628",border:"1px solid #00b4d8",borderRadius:12,padding:12,display:"flex",gap:8,alignItems:"center"}}>
            <input type="date" value={dtAdd} onChange={e=>setDtAdd(e.target.value)}
              style={{flex:1,background:"#060d18",border:"1px solid #0e2035",borderRadius:8,
                padding:"8px 10px",color:"#fff",fontSize:14,outline:"none"}}/>
            <button onClick={()=>{marcarAula(s,true,dtAdd);setShowAdd(false);}}
              style={{padding:"8px 14px",borderRadius:8,border:"none",
                background:"linear-gradient(135deg,#00c864,#00e5aa)",
                color:"#000",fontSize:13,fontWeight:700,cursor:"pointer"}}>✓ Feita</button>
            <button onClick={()=>{marcarAula(s,false,dtAdd);setShowAdd(false);}}
              style={{padding:"8px 10px",borderRadius:8,border:"none",
                background:"rgba(239,68,68,0.15)",color:"#ef4444",fontSize:12,fontWeight:700,cursor:"pointer"}}>✗ Faltou</button>
            <button onClick={()=>setShowAdd(false)}
              style={{padding:"6px 8px",borderRadius:8,border:"none",
                background:"transparent",color:"#4a7a9b",cursor:"pointer"}}>✕</button>
          </div>}
      </div>

      <CobrancaBlock s={s} dadas={dadas} mesAtual={mesAtual} onUpdate={onUpdate} setSelected={setSelected} meuPix={meuPix}/>

      {(s.pagamentos||[]).length>0&&<div style={{background:"#0a1628",border:"1px solid #0e2035",borderRadius:16,padding:14}}>
        <div style={{fontSize:10,color:"#4a7a9b",letterSpacing:1,marginBottom:10}}>HISTÓRICO DE PAGAMENTOS</div>
        {[...(s.pagamentos||[])].sort((a,b)=>b.data.localeCompare(a.data)).map(p=>(
          <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #0a1e30"}}>
            <div><div style={{fontSize:13,fontWeight:600}}>{fmtDate(p.data)}</div><div style={{fontSize:11,color:"#4a7a9b"}}>{p.aulas} aulas</div></div>
            <div style={{fontSize:15,fontWeight:800,color:"#00c864"}}>R$ {p.valor||"—"}</div>
          </div>
        ))}
      </div>}
      {confirm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#0a1628",borderRadius:20,padding:24,maxWidth:320,width:"100%",border:"1px solid #0e2035"}}>
          <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Apagar aluno?</div>
          <div style={{fontSize:13,color:"#4a7a9b",marginBottom:20}}>Todos os dados serão apagados.</div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfirm(null)} style={{flex:1,padding:12,borderRadius:10,border:"1px solid #0e2035",background:"transparent",color:"#aaa",cursor:"pointer"}}>Cancelar</button>
            <button onClick={()=>{onDelete(confirm);setScreen("list");setConfirm(null);}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,cursor:"pointer"}}>Apagar</button>
          </div>
        </div>
      </div>}
      <div style={{height:1,background:"#0a1e30",margin:"20px 0"}}/>
      <button onClick={()=>setConfirm(s.id)} style={{width:"100%",padding:"10px",borderRadius:12,border:"1px solid #3a1a1a",background:"transparent",color:"#ef4444",fontSize:12,cursor:"pointer",opacity:0.6}}>🗑 Apagar aluno</button>
    </div>;
  }

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <div><div style={{fontSize:11,color:"#4a7a9b",letterSpacing:2,textTransform:"uppercase"}}>Meus Alunos</div><div style={{fontSize:12,color:"#2a5a7a"}}>{mesNome}</div></div>
      <button onClick={()=>setScreen("form-new")} style={{padding:"9px 16px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#00b4d8,#00e5ff)",color:"#000",fontWeight:700,cursor:"pointer",fontSize:14}}>+ Aluno</button>
    </div>
    {students.length===0&&<div style={{textAlign:"center",padding:"40px 20px",color:"#2a5a7a"}}><div style={{fontSize:48,marginBottom:10}}>👥</div><div style={{fontSize:15,fontWeight:600,marginBottom:6}}>Nenhum aluno ainda</div><div style={{fontSize:13}}>Toque em "+ Aluno" para começar</div></div>}
    {students.map(s=>{
      const dadas=aulasDadas(s),faltas=faltasDoMes(s),total=totalMes(s);
      const pacotePago2=parseInt(s.pacotePago)||0;
      const totalList=pacotePago2>0?pacotePago2:total;
      const pct=Math.min((dadas/Math.max(totalList,1))*100,100);
      const completo=pacotePago2>0&&dadas>=pacotePago2;
      const bColor=completo?"#00c864":faltas>0?"#ef4444":"#0e2035";
      return <div key={s.id} onClick={()=>{setSelected(s);setScreen("detail");}} style={{background:"#0a1628",border:`1px solid ${bColor}`,borderRadius:16,padding:"14px 16px",marginBottom:10,cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:40,height:40,borderRadius:12,background:`${bColor}22`,border:`1px solid ${bColor}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800,color:bColor,flexShrink:0}}>{s.nome.charAt(0).toUpperCase()}</div>
            <div><div style={{fontSize:15,fontWeight:700}}>{s.nome}</div><div style={{fontSize:12,color:"#4a7a9b"}}>R${s.valorAula||"—"}/aula{(s.pacotePago||0)>0?` · ${s.pacotePago}aq`:""}</div></div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:20,fontWeight:900,color:completo?"#00c864":"#fff"}}>{dadas}<span style={{fontSize:12,color:"#4a7a9b",fontWeight:400}}>/{total}</span></div>
            {completo&&<div style={{fontSize:10,color:"#00c864",fontWeight:700}}>COBRAR 💰</div>}
            {faltas>0&&!completo&&<div style={{fontSize:10,color:"#ef4444"}}>{faltas} falta{faltas>1?"s":""}</div>}
          </div>
        </div>
        <div style={{height:5,background:"#0e2035",borderRadius:3,overflow:"hidden",marginTop:10}}>
          <div style={{height:"100%",width:`${pct}%`,borderRadius:3,background:completo?"linear-gradient(90deg,#00c864,#00e5aa)":faltas>0?"linear-gradient(90deg,#ef4444,#f87171)":"linear-gradient(90deg,#00b4d8,#00e5ff)"}}/>
        </div>
      </div>;
    })}
    {confirm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#0a1628",borderRadius:20,padding:24,maxWidth:320,width:"100%",border:"1px solid #0e2035"}}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Apagar aluno?</div>
        <div style={{fontSize:13,color:"#4a7a9b",marginBottom:20}}>Todos os dados serão apagados.</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setConfirm(null)} style={{flex:1,padding:12,borderRadius:10,border:"1px solid #0e2035",background:"transparent",color:"#aaa",cursor:"pointer"}}>Cancelar</button>
          <button onClick={()=>{onDelete(confirm);setConfirm(null);}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,cursor:"pointer"}}>Apagar</button>
        </div>
      </div>
    </div>}
  </div>;
}

// ── FINANCEIRO VIEW ───────────────────────────────────────────────────────────
// FINANCEIRO - receitas (pagamentos), despesas manuais, potencial a receber
// ═══════════════════════════════════════════════════
// SEÇÃO 14: ABA FINANCEIRO (R$)
// Receitas: soma pagamentos dos alunos por mês
// Despesas: registro manual de gastos
// Potencial: total de aulas previstas × valor/aula
// ═══════════════════════════════════════════════════
function FinanceiroView({students,onUpdate}){
  const now=new Date();
  const [mesSel,setMesSel]=useState(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`);
  const [addDespesa,setAddDespesa]=useState(false);
  const [despesas,setDespesas]=useState(()=>ll("fl_despesas",[]));
  const [formD,setFormD]=useState({descricao:"",valor:"",data:todayStr(),categoria:"outro"});

  const saveDespesas=d=>{setDespesas(d);ls("fl_despesas",d);gsSave("despesas",d);};

  const CATS=[
    {id:"aluguel",label:"Aluguel",emoji:"🏠",color:"#ef4444"},
    {id:"equipamento",label:"Equipamento",emoji:"🏋️",color:"#f97316"},
    {id:"marketing",label:"Marketing",emoji:"📣",color:"#eab308"},
    {id:"transporte",label:"Transporte",emoji:"🚗",color:"#84cc16"},
    {id:"alimentacao",label:"Alimentação",emoji:"🥗",color:"#14b8a6"},
    {id:"curso",label:"Cursos",emoji:"📚",color:"#8b5cf6"},
    {id:"outro",label:"Outro",emoji:"📌",color:"#4a7a9b"},
  ];

  // receitas do mês = todos pagamentos registrados
  const receitasMes=students.flatMap(s=>
    (s.pagamentos||[]).filter(p=>p.mes===mesSel||p.data?.startsWith(mesSel))
      .map(p=>({...p,aluno:s.nome}))
  ).sort((a,b)=>b.data.localeCompare(a.data));

  const despesasMes=despesas.filter(d=>d.data.startsWith(mesSel)).sort((a,b)=>b.data.localeCompare(a.data));

  const totalReceitas=receitasMes.reduce((a,p)=>a+(parseFloat(p.valor)||0),0);
  const totalDespesas=despesasMes.reduce((a,d)=>a+(parseFloat(d.valor)||0),0);
  const lucro=totalReceitas-totalDespesas;

  // Potencial: soma dos valores de todos os alunos ativos (ainda não pagaram este mês)
  const potencial=students.reduce((a,s)=>{
    const jaPagou=(s.pagamentos||[]).some(p=>p.mes===mesSel||p.data?.startsWith(mesSel));
    return jaPagou?a:a+(parseFloat(s.valor)||0);
  },0);

  // gera lista dos últimos 6 meses para o seletor
  const meses=Array.from({length:6},(_,i)=>{
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    return{val:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,label:`${MONTHS[d.getMonth()]} ${d.getFullYear()}`};
  });

  // alunos inadimplentes (completaram pacote mas não pagaram este mês)
  const inadimplentes=students.filter(s=>{
    const dadas=(s.aulas||[]).filter(a=>a.data.startsWith(mesSel)&&a.presente).length;
    const pagou=(s.pagamentos||[]).some(p=>p.mes===mesSel||p.data?.startsWith(mesSel));
    return dadas>=(s.pacote||8)&&!pagou;
  });

  // despesas por categoria
  const porCat=CATS.map(c=>({
    ...c,total:despesasMes.filter(d=>d.categoria===c.id).reduce((a,d)=>a+(parseFloat(d.valor)||0),0)
  })).filter(c=>c.total>0);

  return <div>
    <div style={{fontSize:11,color:"#4a7a9b",letterSpacing:2,textTransform:"uppercase",marginBottom:12}}>Financeiro</div>

    {/* seletor de mês */}
    <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:16,scrollbarWidth:"none"}}>
      {meses.map(m=><button key={m.val} onClick={()=>setMesSel(m.val)} style={{flex:"0 0 auto",padding:"7px 14px",borderRadius:20,border:`1px solid ${mesSel===m.val?"#00e5ff":"#0e2035"}`,background:mesSel===m.val?"rgba(0,229,255,0.1)":"transparent",color:mesSel===m.val?"#00e5ff":"#4a7a9b",fontSize:13,fontWeight:mesSel===m.val?700:400,cursor:"pointer",whiteSpace:"nowrap"}}>{m.label}</button>)}
    </div>

    {/* cards resumo */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
      {[
        {label:"Recebido",value:totalReceitas,color:"#00c864",bg:"rgba(0,200,100,0.08)",border:"rgba(0,200,100,0.2)"},
        {label:"Despesas",value:totalDespesas,color:"#ef4444",bg:"rgba(239,68,68,0.08)",border:"rgba(239,68,68,0.2)"},
        {label:"Lucro",value:lucro,color:lucro>=0?"#00e5ff":"#f87171",bg:lucro>=0?"rgba(0,229,255,0.08)":"rgba(239,68,68,0.08)",border:lucro>=0?"rgba(0,229,255,0.2)":"rgba(239,68,68,0.2)"},
      ].map(c=><div key={c.label} style={{background:c.bg,border:`1px solid ${c.border}`,borderRadius:14,padding:"12px 10px",textAlign:"center"}}>
        <div style={{fontSize:10,color:"#4a7a9b",marginBottom:4}}>{c.label}</div>
        <div style={{fontSize:16,fontWeight:800,color:c.color}}>R${Math.round(c.value)}</div>
      </div>)}
      {potencial>0&&<div style={{background:"rgba(234,179,8,0.07)",border:"1px solid #eab30833",borderRadius:14,padding:"12px 10px",textAlign:"center",gridColumn:"1/-1"}}>
        <div style={{fontSize:10,color:"#eab308",marginBottom:2}}>A RECEBER (alunos sem pagamento este mês)</div>
        <div style={{fontSize:20,fontWeight:800,color:"#eab308"}}>R$ {Math.round(potencial)}</div>
        <div style={{fontSize:11,color:"#2a5a7a",marginTop:2}}>Registre o pagamento na aba Alunos para mover para Recebido</div>
      </div>}
    </div>

    {/* inadimplentes */}
    {inadimplentes.length>0&&<div style={{background:"rgba(234,179,8,0.07)",border:"1px solid #eab30833",borderRadius:14,padding:"12px 14px",marginBottom:14}}>
      <div style={{fontSize:12,color:"#eab308",fontWeight:700,marginBottom:8}}>⚠️ Aguardando pagamento</div>
      {inadimplentes.map(s=><div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #1a2a1a"}}>
        <span style={{fontSize:13,fontWeight:600}}>{s.nome}</span>
        <span style={{fontSize:14,fontWeight:800,color:"#eab308"}}>R$ {s.valor||"—"}</span>
      </div>)}
    </div>}

    {/* receitas */}
    <div style={{background:"#0a1628",border:"1px solid #0e2035",borderRadius:16,padding:14,marginBottom:12}}>
      <div style={{fontSize:12,color:"#00c864",fontWeight:700,marginBottom:10}}>💰 Receitas — R$ {Math.round(totalReceitas)}</div>
      {receitasMes.length===0&&<div style={{fontSize:13,color:"#2a5a7a",textAlign:"center",padding:"12px 0"}}>Nenhuma receita registrada</div>}
      {receitasMes.map(p=><div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #0a1e30"}}>
        <div>
          <div style={{fontSize:13,fontWeight:600}}>{p.aluno}</div>
          <div style={{fontSize:11,color:"#4a7a9b"}}>{fmtDate(p.data)} · {p.aulas} aulas</div>
        </div>
        <div style={{fontSize:15,fontWeight:800,color:"#00c864"}}>R$ {p.valor||"—"}</div>
      </div>)}
    </div>

    {/* despesas */}
    <div style={{background:"#0a1628",border:"1px solid #0e2035",borderRadius:16,padding:14,marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:12,color:"#ef4444",fontWeight:700}}>💸 Despesas — R$ {Math.round(totalDespesas)}</div>
        <button onClick={()=>setAddDespesa(!addDespesa)} style={{padding:"5px 12px",borderRadius:8,border:"none",background:"rgba(239,68,68,0.15)",color:"#ef4444",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Adicionar</button>
      </div>

      {addDespesa&&<div style={{background:"#060d18",borderRadius:12,padding:14,marginBottom:12,border:"1px solid #0e2035"}}>
        <input value={formD.descricao} onChange={e=>setFormD(f=>({...f,descricao:e.target.value}))} placeholder="Descrição"
          style={{width:"100%",background:"#0a1628",border:"1px solid #0e2035",borderRadius:10,padding:"10px 12px",color:"#fff",fontSize:14,outline:"none",marginBottom:8}}/>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <div style={{flex:1}}>
            <div style={{fontSize:10,color:"#4a7a9b",marginBottom:4}}>VALOR (R$)</div>
            <input type="number" value={formD.valor} onChange={e=>setFormD(f=>({...f,valor:e.target.value}))}
              style={{width:"100%",background:"#0a1628",border:"1px solid #0e2035",borderRadius:10,padding:"10px 6px",color:"#fff",fontSize:16,fontWeight:700,textAlign:"center",outline:"none"}}/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:10,color:"#4a7a9b",marginBottom:4}}>DATA</div>
            <input type="date" value={formD.data} onChange={e=>setFormD(f=>({...f,data:e.target.value}))}
              style={{width:"100%",background:"#0a1628",border:"1px solid #0e2035",borderRadius:10,padding:"10px 6px",color:"#fff",fontSize:13,outline:"none"}}/>
          </div>
        </div>

        </div>
      </div>)}
    </div>}
  </div>;
}

// ── CÁLCULO DE PACOTE REAL ───────────────────────────────────────────────────
// Conta exatamente quantas vezes cada dia da semana aparece no mês/período
// diasSemana: array de ints 0-6 (0=dom,1=seg,...,6=sab)
// se fromToday=true, conta apenas a partir de hoje
// ═══════════════════════════════════════════════════
// SEÇÃO 4: FUNÇÕES UTILITÁRIAS
// - calcPacoteReal: calcula aulas num mês pelos diasSemana
// - detectMuscle: detecta grupo muscular pelo nome do exercício
// - uid, todayStr, dateStr, addDays, fmtDate, fmtFull: helpers
// ═══════════════════════════════════════════════════
function calcPacoteReal(ano, mes, diasSemana, fromToday=false){
  const start=fromToday?new Date():new Date(ano,mes-1,1);
  start.setHours(0,0,0,0);
  const end=new Date(ano,mes,0); // último dia do mês
  end.setHours(23,59,59,0);
  let count=0;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    if(diasSemana.includes(d.getDay())) count++;
  }
  return count;
}

// Próximo mês
function calcPacoteProxMes(diasSemana){
  const now=new Date();
  const ano=now.getMonth()===11?now.getFullYear()+1:now.getFullYear();
  const mes=now.getMonth()===11?1:now.getMonth()+2;
  return calcPacoteReal(ano,mes,diasSemana,false);
}

// ── VIGÊNCIA / PERÍODO DE COBRANÇA ───────────────────────────────────────────
// Conta aulas (occorrências dos diasSemana) entre início e fim inclusive
function calcAulasPeriodo(inicio,fim,diasSemana){
  if(!diasSemana||!diasSemana.length||!inicio||!fim) return 0;
  let cnt=0;
  const dt=new Date(inicio+"T12:00");
  const fimDt=new Date(fim+"T12:00");
  while(dt<=fimDt){if(diasSemana.includes(dt.getDay()))cnt++;dt.setDate(dt.getDate()+1);}
  return cnt;
}

// Mesmo dia D do próximo mês (ajusta se o mês não tiver esse dia)
function mesmoDiaMesSeguinte(dataStr){
  const d=new Date(dataStr+"T12:00");
  let mes=d.getMonth()+2,ano=d.getFullYear();
  if(mes>12){mes=1;ano++;}
  const ultimo=new Date(ano,mes,0).getDate();
  return `${ano}-${String(mes).padStart(2,"0")}-${String(Math.min(d.getDate(),ultimo)).padStart(2,"0")}`;
}

// Vigência ativa do aluno: período do pacote atual
// Se tiver vigenciaInicio/Fim definidos usa eles; senão usa mês atual
function getVigencia(s){
  if(s&&s.vigenciaInicio&&s.vigenciaFim) return{inicio:s.vigenciaInicio,fim:s.vigenciaFim};
  const n=new Date(),ano=n.getFullYear(),mes=n.getMonth()+1;
  return{
    inicio:`${ano}-${String(mes).padStart(2,"0")}-01`,
    fim:new Date(ano,mes,0).toISOString().slice(0,10)
  };
}

// Início do pacote atual — para contar aulas sem depender de aulaAtual manual
// Prioridade: vigenciaInicio > data do último pagamento > início do mês
function getPackageStart(s){
  if(s&&s.vigenciaInicio) return s.vigenciaInicio;
  const pags=((s&&s.pagamentos)||[]).sort((a,b)=>b.data.localeCompare(a.data));
  if(pags.length>0) return pags[0].data;
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-01`;
}

    const newChecks=jaFez?checks.filter(d=>d!==todayDs):[...checks,todayDs];

    let streak=0;const sorted=[...newChecks].sort((a,b)=>b.localeCompare(a));
    let cur=new Date();
    for(const ds of sorted){
      const diff=Math.round((cur-new Date(ds+"T12:00"))/86400000);
      if(diff<=1){streak++;cur=new Date(ds+"T12:00");}else break;

          </div>
        </div>;
      })}

    {subTab==="metas"&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div>
          <div style={{fontSize:11,color:"#4a7a9b",letterSpacing:1}}>METAS DO MÊS</div>
          <div style={{fontSize:12,color:"#2a5a7a"}}>{MONTHS_PT[now.getMonth()]} {now.getFullYear()}</div>
        </div>
        <button onClick={()=>setAddM(!addM)} style={{padding:"5px 12px",borderRadius:8,border:"none",background:"rgba(0,180,216,0.1)",color:"#00b4d8",fontSize:12,fontWeight:600,cursor:"pointer"}}>+ Meta</button>

      {addM&&<div style={{background:"#0a1628",border:"1px solid #0e2035",borderRadius:14,padding:14,marginBottom:12}}>

          style={{width:"100%",background:"#060d18",border:"1px solid #0e2035",borderRadius:10,padding:"10px 12px",color:"#fff",fontSize:14,outline:"none",marginBottom:8}}/>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <div style={{flex:1}}>
            <div style={{fontSize:10,color:"#4a7a9b",marginBottom:4}}>META (número)</div>
            <input type="number" value={formM.total} min="1" onChange={e=>setFormM(f=>({...f,total:+e.target.value}))}
              style={{width:"100%",background:"#060d18",border:"1px solid #0e2035",borderRadius:10,padding:"9px 6px",color:"#fff",fontSize:18,fontWeight:700,textAlign:"center",outline:"none"}}/>
          </div>
          <div style={{flex:2}}>
            <div style={{fontSize:10,color:"#4a7a9b",marginBottom:4}}>CATEGORIA</div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {CATS.map(c=><button key={c.id} onClick={()=>setFormM(f=>({...f,categoria:c.id}))}
                style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${formM.categoria===c.id?"#00e5ff":"#0e2035"}`,
                  background:formM.categoria===c.id?"rgba(0,229,255,0.1)":"transparent",
                  color:formM.categoria===c.id?"#00e5ff":"#4a7a9b",fontSize:11,cursor:"pointer"}}>{c.emoji} {c.label}</button>)}
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setAddM(false)} style={{flex:1,padding:10,borderRadius:10,border:"1px solid #0e2035",background:"transparent",color:"#4a7a9b",cursor:"pointer"}}>Cancelar</button>
          <button onClick={addMeta} style={{flex:2,padding:10,borderRadius:10,border:"none",background:"linear-gradient(135deg,#00b4d8,#00e5ff)",color:"#000",fontWeight:700,cursor:"pointer"}}>Criar Meta</button>
        </div>
      </div>}
      {metasMes.length===0&&!addM&&<div style={{textAlign:"center",padding:"32px 0",color:"#2a5a7a"}}>
        <div style={{fontSize:40,marginBottom:8}}>🎯</div>
        <div style={{fontSize:15,fontWeight:600,marginBottom:4}}>Nenhuma meta este mês</div>
        <div style={{fontSize:13}}>Defina o que quer conquistar!</div>
      </div>}
      {metasMes.map(m=>{
        const cat=CATS.find(c=>c.id===m.categoria)||CATS[3];
        const pct=Math.min(((m.atual||0)/m.total)*100,100);
        const concluida=(m.atual||0)>=m.total;
        return <div key={m.id} style={{background:"#0a1628",border:`1px solid ${concluida?"#00c86444":"#0e2035"}`,borderRadius:16,padding:16,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                <span style={{fontSize:16}}>{cat.emoji}</span>
                <span style={{fontSize:14,fontWeight:700,color:concluida?"#00c864":"#fff"}}>{m.texto}</span>
                {concluida&&<span style={{fontSize:14}}>🏆</span>}
              </div>
              <div style={{fontSize:12,color:"#4a7a9b"}}>{cat.label}</div>
            </div>
            <button onClick={()=>delMeta(m.id)} style={{background:"none",border:"none",color:"#2a3a4a",cursor:"pointer",fontSize:18}}>×</button>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <button onClick={()=>incrementMeta(m.id,-1)}
              style={{width:34,height:34,borderRadius:8,border:"1px solid #0e2035",background:"transparent",color:"#4a7a9b",cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
            <div style={{flex:1}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:20,fontWeight:900,color:concluida?"#00c864":"#00e5ff"}}>{m.atual||0}</span>
                <span style={{fontSize:14,color:"#4a7a9b"}}>/ {m.total}</span>
              </div>
              <div style={{height:8,background:"#0e2035",borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,borderRadius:4,transition:"width 0.4s",
                  background:concluida?"linear-gradient(90deg,#00c864,#00e5aa)":"linear-gradient(90deg,#00b4d8,#00e5ff)"}}/>
              </div>
            </div>
            <button onClick={()=>incrementMeta(m.id,1)}
              style={{width:34,height:34,borderRadius:8,border:"1px solid #0e2035",background:"transparent",color:"#4a7a9b",cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
          </div>
        </div>;
      })}
    </div>}
  </div>;
}
